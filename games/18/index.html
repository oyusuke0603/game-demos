<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ビリヤード</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#1a1a2e; display:flex; flex-direction:column;
  align-items:center; min-height:100vh;
  font-family:'Georgia',serif; color:#e8d5a3; overflow-x:hidden;
}
h1 {
  font-size:2rem; letter-spacing:0.3em; color:#f0c060;
  text-shadow:0 0 20px rgba(240,192,96,0.5);
  padding:14px 0 8px; font-weight:normal;
}
/* ===== MODE SELECT ===== */
#mode-overlay {
  position:fixed; inset:0; background:rgba(8,12,20,0.96);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:200; gap:20px;
}
#mode-overlay h2 { font-size:2.2rem; color:#f0c060; letter-spacing:0.25em; font-weight:normal; }
#mode-overlay p  { color:#88a880; font-size:0.9rem; margin-top:-12px; }
.mode-btn {
  width:280px; padding:16px 0; font-size:1.05rem; letter-spacing:0.08em;
  background:#0e1e0c; border:2px solid #3a6030; border-radius:12px;
  color:#c8e0b0; cursor:pointer; font-family:'Georgia',serif; transition:all 0.15s;
}
.mode-btn:hover { background:#1a3a18; border-color:#f0c060; color:#f0c060; }
.mode-btn small { display:block; font-size:0.75rem; color:#78987a; margin-top:3px; }
.diff-row { display:flex; gap:10px; align-items:center; }
.diff-btn {
  padding:10px 22px; font-size:0.9rem; border-radius:8px;
  border:2px solid #3a5030; background:#0a180a; color:#a0c090;
  cursor:pointer; font-family:'Georgia',serif; transition:all 0.15s;
}
.diff-btn:hover, .diff-btn.selected { border-color:#f0c060; background:#1e3a18; color:#f0c060; }
#diff-label { color:#88a880; font-size:0.85rem; }

/* ===== UI BAR ===== */
#ui-bar {
  display:flex; gap:18px; align-items:center; margin-bottom:8px;
  font-size:0.95rem; color:#c8b87a; flex-wrap:wrap; justify-content:center;
}
#ui-bar span { font-size:1.15rem; color:#f0c060; font-weight:bold; }
#turn-indicator {
  padding:4px 16px; border-radius:20px; font-size:0.9rem;
  border:1px solid #3a6030; background:rgba(0,0,0,0.3);
}
#turn-indicator.cpu { border-color:#c05020; background:rgba(60,10,0,0.3); color:#f08050; }
#turn-indicator.player { border-color:#3a8050; background:rgba(0,40,10,0.3); color:#60d090; }

/* ===== CANVAS ===== */
#canvas-wrap {
  position:relative; border:6px solid #7a5c2e; border-radius:12px;
  box-shadow:0 0 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.4);
  background:#1a6636; cursor:crosshair;
}
canvas { display:block; border-radius:6px; touch-action:none; }

/* ===== POWER BAR ===== */
#power-bar-wrap {
  width:100%; max-width:780px; margin:8px auto 0;
  display:flex; align-items:center; gap:12px; font-size:0.9rem; color:#c8b87a;
}
#power-bar-bg {
  flex:1; height:14px; background:#0a3a1a;
  border-radius:7px; border:1px solid #3a6040; overflow:hidden;
}
#power-bar {
  height:100%; width:0%;
  background:linear-gradient(90deg,#40c060,#f0c060,#e04020);
  border-radius:7px; transition:width 0.05s;
}
#info-bar {
  display:flex; gap:20px; align-items:center; margin-top:6px;
  font-size:0.82rem; color:#88a880; flex-wrap:wrap; justify-content:center;
}

/* ===== PLAYER CARDS (CPU mode) ===== */
#player-cards {
  width:100%; max-width:780px; margin:8px auto 0;
  display:none; gap:12px;
}
.pcard {
  flex:1; padding:8px 12px; border-radius:10px;
  border:2px solid transparent; background:rgba(0,0,0,0.3);
  transition:all 0.2s; min-width:0;
}
.pcard.active { border-color:#f0c060; background:rgba(240,192,96,0.1); }
.pcard .pc-name { font-size:0.8rem; color:#88a880; margin-bottom:3px; }
.pcard .pc-score { font-size:1.2rem; font-weight:bold; color:#f0c060; }
.pcard .pc-balls { display:flex; flex-wrap:wrap; gap:3px; margin-top:4px; min-height:20px; }
.mini-ball {
  width:20px; height:20px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:8px; font-weight:900; font-family:'Arial Black',Arial,sans-serif; flex-shrink:0;
}

/* ===== POCKETED AREA (solo) ===== */
#pocketed-area {
  width:100%; max-width:780px; margin:8px auto 0;
  background:rgba(0,0,0,0.3); border:1px solid #3a4030;
  border-radius:10px; padding:7px 12px;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-height:48px;
}
#pocketed-area .pa-label { font-size:0.8rem; color:#88a880; white-space:nowrap; }
#pocketed-balls { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
.pb-ball {
  width:32px; height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:900; font-family:'Arial Black',Arial,sans-serif;
  border:2px solid rgba(255,255,255,0.25);
  box-shadow:inset -2px -2px 4px rgba(0,0,0,0.4), inset 1px 1px 3px rgba(255,255,255,0.3);
  flex-shrink:0;
}

/* ===== BUTTONS ===== */
#btn-row { display:flex; gap:10px; margin-top:8px; }
.ctrl-btn {
  padding:7px 18px; background:#3a2a10; border:1px solid #7a5c2e;
  border-radius:8px; color:#e8d5a3; font-size:0.85rem;
  cursor:pointer; font-family:'Georgia',serif; letter-spacing:0.08em;
}
.ctrl-btn:hover { background:#5a4a30; border-color:#f0c060; color:#f0c060; }

/* ===== MESSAGE BOX ===== */
#message-box {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  background:rgba(10,20,15,0.94); border:2px solid #f0c060; border-radius:12px;
  padding:22px 32px; text-align:center; font-size:1.3rem; color:#f0c060;
  display:none; z-index:10; min-width:240px;
}
#message-box button {
  margin-top:14px; margin-right:6px; padding:9px 22px;
  background:#7a5c2e; border:1px solid #f0c060; border-radius:8px;
  color:#f0c060; font-size:0.95rem; cursor:pointer; font-family:'Georgia',serif;
}
#message-box button:hover { background:#9a7c4e; }

/* ===== CPU THINKING ===== */
#cpu-thinking {
  position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
  background:rgba(60,10,0,0.85); border:1px solid #c05020;
  border-radius:8px; padding:5px 18px; color:#f08050; font-size:0.85rem;
  display:none; z-index:5;
}

html,body{height:100%}
@media (max-width:600px){
  html,body{overflow:hidden}
  #mode-overlay{overflow-y:auto; padding:16px 0}
  #mode-overlay h2{font-size:1.6rem}
  .mode-btn{width:88vw; max-width:280px}
  body{height:100dvh; padding:6px 6px}
  h1{font-size:1.15rem; letter-spacing:0.15em; padding:6px 0 4px}
  #ui-bar{font-size:0.72rem; gap:10px; margin-bottom:5px}
  #ui-bar span{font-size:0.88rem}
  #turn-indicator{font-size:0.68rem; padding:3px 10px}
  #player-cards{margin:5px auto 0; gap:8px}
  .pcard{padding:5px 8px}
  .pcard .pc-name{font-size:0.65rem; margin-bottom:2px}
  .pcard .pc-score{font-size:0.95rem}
  .pcard .pc-balls{min-height:16px; gap:2px}
  .mini-ball{width:16px;height:16px;font-size:7px}
  #power-bar-wrap{margin:5px auto 0; font-size:0.72rem; gap:8px}
  #power-bar-bg{height:10px}
  #info-bar{font-size:0.63rem; gap:10px; margin-top:3px}
  #btn-row{margin-top:5px; gap:6px}
  .ctrl-btn{padding:5px 12px; font-size:0.7rem}
  #pocketed-area{margin:5px auto 0; padding:5px 8px; min-height:32px; gap:5px}
  #pocketed-area .pa-label{font-size:0.66rem}
  .pb-ball{width:24px;height:24px;font-size:8px}
}

/* ラッパーは通常時レイアウトに影響を与えない（縦積みのまま） */
#game-layout, #canvas-col, #side-col { display:contents; }

/* ===== スマホ横画面レイアウト：JSのクラス切替で適用（自動判定＋手動選択の両対応） ===== */
html.landscape-layout,body.landscape-layout{overflow:hidden}
body.landscape-layout{
  height:100dvh; padding:6px 8px;
  flex-direction:row; align-items:center; justify-content:center;
}
body.landscape-layout #game-layout{
  display:flex; flex-direction:row; align-items:center; justify-content:center;
  gap:10px; width:100%; height:100%;
}
body.landscape-layout #canvas-col{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:0; flex-shrink:0; height:100%;
}
body.landscape-layout #canvas-col h1{display:none}
body.landscape-layout #canvas-wrap{margin:0}
body.landscape-layout #side-col{
  display:flex; flex-direction:column; justify-content:center;
  gap:5px; width:132px; flex-shrink:0; max-height:100%; overflow-y:auto;
}
body.landscape-layout #ui-bar{flex-direction:column; align-items:flex-start; gap:2px; font-size:0.6rem; margin:0}
body.landscape-layout #ui-bar span{font-size:0.72rem}
body.landscape-layout #turn-indicator{font-size:0.58rem; padding:2px 8px; align-self:flex-start}
body.landscape-layout #player-cards{flex-direction:column; margin:0; gap:4px}
body.landscape-layout .pcard{padding:4px 6px}
body.landscape-layout .pcard .pc-name{font-size:0.56rem; margin-bottom:1px}
body.landscape-layout .pcard .pc-score{font-size:0.8rem}
body.landscape-layout .pcard .pc-balls{min-height:0}
body.landscape-layout .mini-ball{width:13px;height:13px;font-size:6px}
body.landscape-layout #power-bar-wrap{margin:0; font-size:0.58rem; gap:4px}
body.landscape-layout #power-bar-bg{height:8px}
body.landscape-layout #info-bar{display:none}
body.landscape-layout #btn-row{flex-direction:column; margin:0; gap:4px}
body.landscape-layout .ctrl-btn{padding:4px 8px; font-size:0.58rem}
body.landscape-layout #pocketed-area{flex-direction:column; align-items:flex-start; margin:0; padding:4px 6px; min-height:0; gap:3px}
body.landscape-layout #pocketed-area .pa-label{font-size:0.56rem}
body.landscape-layout #pocketed-balls{gap:3px}
body.landscape-layout .pb-ball{width:17px;height:17px;font-size:6px}
body.landscape-layout #mode-overlay{overflow-y:auto}

/* ===== 表示切替ボタン ===== */
#layoutToggleBtn{
  position:fixed; top:8px; right:8px; z-index:60;
  padding:6px 12px; font-size:0.72rem; letter-spacing:0.05em;
  background:#3a2a10; border:1px solid #7a5c2e; border-radius:8px;
  color:#e8d5a3; cursor:pointer; font-family:'Georgia',serif;
}
#layoutToggleBtn:hover{ background:#5a4a30; border-color:#f0c060; color:#f0c060; }
</style>
</head>
<body>

<!-- MODE SELECT OVERLAY -->
<div id="mode-overlay">
  <h2>🎱 BILLIARDS</h2>
  <p>モードを選択してください</p>
  <button class="mode-btn" onclick="startSolo()">
    🧑 一人モード
    <small>15球をすべてポケットしてクリア</small>
  </button>
  <button class="mode-btn" onclick="showDiffSelect()">
    🤖 CPU対戦モード
    <small>ソリッド vs ストライプ、8番で決着</small>
  </button>
  <div id="diff-area" style="display:none; flex-direction:column; align-items:center; gap:10px;">
    <div id="diff-label">CPU難易度を選択</div>
    <div class="diff-row">
      <button class="diff-btn selected" id="diff-easy" onclick="selectDiff('easy')">やさしい</button>
      <button class="diff-btn" id="diff-normal" onclick="selectDiff('normal')">ふつう</button>
      <button class="diff-btn" id="diff-hard" onclick="selectDiff('hard')">むずかしい</button>
    </div>
    <button class="mode-btn" onclick="startCPU()" style="margin-top:4px;">
      ▶ CPU対戦スタート
    </button>
  </div>
</div>

<button id="layoutToggleBtn" onclick="toggleLayoutMode()">🔄 横画面で表示</button>

<div id="game-layout">
<div id="canvas-col">
<h1>🎱 BILLIARDS</h1>

<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <div id="message-box">
    <div id="msg-text"></div>
    <button onclick="resetGame()">もう一度</button>
    <button onclick="showModeSelect()">モード選択</button>
  </div>
  <div id="cpu-thinking">🤖 CPU思考中...</div>
</div>
</div>

<div id="side-col">
<div id="ui-bar">
  <div>スコア: <span id="score">0</span></div>
  <div>ショット: <span id="shots">0</span></div>
  <div>残り球: <span id="balls-left">15</span></div>
  <div id="turn-indicator" style="display:none;"></div>
</div>

<!-- CPU MODE PLAYER CARDS -->
<div id="player-cards" style="display:none;">
  <div class="pcard active" id="p1-card" style="display:flex;flex-direction:column;">
    <div class="pc-name">👤 あなた (ソリッド 1〜7)</div>
    <div class="pc-score"><span id="p1-score">0</span> 球</div>
    <div class="pc-balls" id="p1-balls"></div>
  </div>
  <div class="pcard" id="p2-card" style="display:flex;flex-direction:column;">
    <div class="pc-name" id="cpu-name">🤖 CPU (ストライプ 9〜15)</div>
    <div class="pc-score"><span id="p2-score">0</span> 球</div>
    <div class="pc-balls" id="p2-balls"></div>
  </div>
</div>

<div id="power-bar-wrap">
  <div>パワー</div>
  <div id="power-bar-bg"><div id="power-bar"></div></div>
  <div id="power-val">0%</div>
</div>
<div id="info-bar">
  <div>🖱 クリック長押し → 照準＆パワー</div>
  <div>離す → ショット</div>
</div>
<div id="btn-row">
  <button class="ctrl-btn" onclick="resetGame()">🔄 リセット</button>
  <button class="ctrl-btn" onclick="showModeSelect()">📋 モード選択</button>
</div>

<!-- SOLO POCKETED -->
<div id="pocketed-area">
  <div class="pa-label">落ちた球：</div>
  <div id="pocketed-balls"></div>
</div>
</div>
</div>

<script>
// ===================== CONSTANTS =====================
const CANVAS_W=780, CANVAS_H=440;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
canvas.width=CANVAS_W; canvas.height=CANVAS_H;

const POCKET_R=26, BALL_R=16, FRICTION=0.985;
const WALL_L=40, WALL_R=CANVAS_W-40, WALL_T=40, WALL_B=CANVAS_H-40;

const pockets=[
  {x:WALL_L,y:WALL_T},{x:CANVAS_W/2,y:WALL_T-5},{x:WALL_R,y:WALL_T},
  {x:WALL_L,y:WALL_B},{x:CANVAS_W/2,y:WALL_B+5},{x:WALL_R,y:WALL_B}
];

const BALL_COLORS=[
  null,
  '#f5e020','#0040c0','#e02010','#8010a0','#e07010',
  '#207020','#b02010','#303030',
  '#f5e020','#0040c0','#e02010','#8010a0','#e07010',
  '#207020','#b02010'
];
const BALL_CSS=[
  null,
  '#c4b008','#0028a0','#b01008','#600080','#b05008',
  '#145014','#801008','#181818',
  '#c4b008','#0028a0','#b01008','#600080','#b05008',
  '#145014','#801008'
];
const STRIPES=[9,10,11,12,13,14,15];
const P1_BALLS=[1,2,3,4,5,6,7]; // player solid
const P2_BALLS=[9,10,11,12,13,14,15]; // cpu stripe

// ===================== STATE =====================
let balls=[], cueBall;
let score=0, shots=0;
let aiming=false, power=0, maxPower=18;
let isMoving=false, gameOver=false, animId;
let mouseX=0, mouseY=0, powerInterval=null;

// mode: 'solo' | 'cpu'
let gameMode='solo';
let cpuDiff='normal'; // 'easy'|'normal'|'hard'
let currentPlayer=1; // 1=human, 2=cpu
let p1Pocketed=[], p2Pocketed=[];
let shotPocketedBefore=[];
let cpuThinking=false;

// ===================== AUDIO =====================
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();

function playHit(vol=0.5,freq=300){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.type='triangle';
  o.frequency.setValueAtTime(freq,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(freq*0.3,audioCtx.currentTime+0.15);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.2);
  o.start();o.stop(audioCtx.currentTime+0.2);
}
function playPocket(){
  for(let i=0;i<3;i++) setTimeout(()=>{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.frequency.value=200-i*40;o.type='triangle';
    g.gain.setValueAtTime(0.4,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.3);
    o.start();o.stop(audioCtx.currentTime+0.3);
  },i*100);
}
function playCue(pwr){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.type='sawtooth';
  o.frequency.setValueAtTime(80+pwr*20,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(40,audioCtx.currentTime+0.1);
  g.gain.setValueAtTime(pwr/maxPower*0.6,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.12);
  o.start();o.stop(audioCtx.currentTime+0.12);
}
function playWall(){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.type='square';o.frequency.value=150;
  g.gain.setValueAtTime(0.2,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.08);
  o.start();o.stop(audioCtx.currentTime+0.08);
}
function playWin(){
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.4,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.5);
    o.start();o.stop(audioCtx.currentTime+0.5);
  },i*160));
}

// ===================== RESPONSIVE CANVAS =====================
let layoutMode='portrait'; // 'portrait' | 'landscape'
let manualLayoutOverride=false;
const landscapeMQ=window.matchMedia('(max-height:500px) and (orientation:landscape)');

function applyLayoutMode(mode){
  layoutMode=mode;
  const isLandscape=mode==='landscape';
  document.documentElement.classList.toggle('landscape-layout',isLandscape);
  document.body.classList.toggle('landscape-layout',isLandscape);
  const btn=document.getElementById('layoutToggleBtn');
  if(btn) btn.textContent=isLandscape?'🔄 縦画面で表示':'🔄 横画面で表示';
  fitCanvas();
}
function toggleLayoutMode(){
  manualLayoutOverride=true;
  applyLayoutMode(layoutMode==='landscape'?'portrait':'landscape');
}
function syncAutoLayout(){
  if(manualLayoutOverride) return;
  applyLayoutMode(landscapeMQ.matches?'landscape':'portrait');
}
if(landscapeMQ.addEventListener) landscapeMQ.addEventListener('change',syncAutoLayout);
else if(landscapeMQ.addListener) landscapeMQ.addListener(syncAutoLayout);

function computeCanvasSize(){
  const bs=getComputedStyle(document.body);
  const padV=(parseFloat(bs.paddingTop)||0)+(parseFloat(bs.paddingBottom)||0);
  const padH=(parseFloat(bs.paddingLeft)||0)+(parseFloat(bs.paddingRight)||0);
  const wrapBorder=12; // canvas-wrap の上下（または左右）ボーダー合計
  const ratio=CANVAS_W/CANVAS_H;
  const isLandscapePhone=document.body.classList.contains('landscape-layout');
  const vv=window.visualViewport;
  const winW=vv?vv.width:window.innerWidth;
  const winH=vv?vv.height:window.innerHeight;

  let availW,availH;
  if(isLandscapePhone){
    // 横画面：canvasとside-colが左右に並ぶので、幅からside-col分を差し引く
    const sideCol=document.getElementById('side-col');
    const sideW=sideCol?sideCol.getBoundingClientRect().width:132;
    const layoutGap=10;
    availW=winW-padH-wrapBorder-sideW-layoutGap-16;
    availH=winH-padV-wrapBorder-16;
  } else {
    // 縦画面・PC：従来通り縦積みの各要素の実測高さから逆算
    const h1El=document.querySelector('h1');
    const uiBar=document.getElementById('ui-bar');
    const playerCards=document.getElementById('player-cards');
    const powerWrap=document.getElementById('power-bar-wrap');
    const infoBar=document.getElementById('info-bar');
    const btnRow=document.getElementById('btn-row');
    const pocketedArea=document.getElementById('pocketed-area');
    const gh=(el)=>{
      if(!el) return 0;
      const cs=getComputedStyle(el);
      if(cs.display==='none') return 0;
      const r=el.getBoundingClientRect();
      return r.height+(parseFloat(cs.marginTop)||0)+(parseFloat(cs.marginBottom)||0);
    };
    const safety=20;
    const usedH=padV+gh(h1El)+gh(uiBar)+gh(playerCards)+gh(powerWrap)+gh(infoBar)+gh(btnRow)+gh(pocketedArea)+wrapBorder+safety;
    availH=winH-usedH;
    availW=winW-padH-wrapBorder-16;
  }
  let finalW=Math.min(availW,availH*ratio,CANVAS_W);
  finalW=Math.max(240,finalW);
  return {w:Math.floor(finalW),h:Math.floor(finalW/ratio)};
}
function fitCanvas(){
  const {w,h}=computeCanvasSize();
  canvas.style.width=w+'px';
  canvas.style.height=h+'px';
  // レイアウト後の実測値で、はみ出していないか検証して自動補正する
  requestAnimationFrame(()=>{
    const wrap=document.getElementById('canvas-wrap');
    if(!wrap) return;
    const rect=wrap.getBoundingClientRect();
    const vv=window.visualViewport;
    const vw=vv?vv.width:window.innerWidth;
    const vh=vv?vv.height:window.innerHeight;
    const overflowBottom=rect.bottom-vh;
    const overflowRight=rect.right-vw;
    const overflow=Math.max(overflowBottom,overflowRight,0);
    if(overflow>2){
      const ratio=CANVAS_W/CANVAS_H;
      const curW=parseFloat(canvas.style.width)||w;
      const newW=Math.max(200,Math.floor(curW-overflow-6));
      canvas.style.width=newW+'px';
      canvas.style.height=Math.floor(newW/ratio)+'px';
    }
  });
}
window.addEventListener('resize',()=>{ syncAutoLayout(); fitCanvas(); });
window.addEventListener('orientationchange',()=>setTimeout(()=>{ syncAutoLayout(); fitCanvas(); },50));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>{ syncAutoLayout(); fitCanvas(); });
// ブラウザのアドレスバー等の表示/非表示が遅れて確定する端末向けに、少し遅れて再調整

// ===================== PHYSICS =====================
function ballsMoving(){
  return balls.some(b=>!b.pocketed&&(Math.abs(b.vx)>0.02||Math.abs(b.vy)>0.02));
}
function resolveCollision(a,b){
  const dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy);
  if(!dist)return;
  const nx=dx/dist,ny=dy/dist,ov=BALL_R*2-dist;
  if(ov<=0)return;
  a.x-=nx*ov*0.5;a.y-=ny*ov*0.5;b.x+=nx*ov*0.5;b.y+=ny*ov*0.5;
  const dvx=a.vx-b.vx,dvy=a.vy-b.vy,dot=dvx*nx+dvy*ny;
  if(dot>0){
    a.vx-=dot*nx;a.vy-=dot*ny;b.vx+=dot*nx;b.vy+=dot*ny;
    const spd=Math.sqrt(dvx*dvx+dvy*dvy);
    if(spd>0.5)playHit(Math.min(spd/10,0.5),260+Math.random()*60);
  }
}
function step(){
  for(const b of balls){
    if(b.pocketed)continue;
    b.x+=b.vx;b.y+=b.vy;
    b.vx*=FRICTION;b.vy*=FRICTION;
    if(Math.abs(b.vx)<0.01)b.vx=0;
    if(Math.abs(b.vy)<0.01)b.vy=0;
    const nearP=pockets.some(p=>{const dx=b.x-p.x,dy=b.y-p.y;return dx*dx+dy*dy<(POCKET_R+BALL_R)*(POCKET_R+BALL_R);});
    if(!nearP){
      if(b.x-BALL_R<WALL_L){b.x=WALL_L+BALL_R;b.vx=Math.abs(b.vx)*0.85;if(Math.abs(b.vx)>0.3)playWall();}
      if(b.x+BALL_R>WALL_R){b.x=WALL_R-BALL_R;b.vx=-Math.abs(b.vx)*0.85;if(Math.abs(b.vx)>0.3)playWall();}
      if(b.y-BALL_R<WALL_T){b.y=WALL_T+BALL_R;b.vy=Math.abs(b.vy)*0.85;if(Math.abs(b.vy)>0.3)playWall();}
      if(b.y+BALL_R>WALL_B){b.y=WALL_B-BALL_R;b.vy=-Math.abs(b.vy)*0.85;if(Math.abs(b.vy)>0.3)playWall();}
    }
  }
  for(let i=0;i<balls.length;i++)
    for(let j=i+1;j<balls.length;j++){
      const a=balls[i],b=balls[j];
      if(a.pocketed||b.pocketed)continue;
      const dx=b.x-a.x,dy=b.y-a.y;
      if(dx*dx+dy*dy<(BALL_R*2)*(BALL_R*2))resolveCollision(a,b);
    }
  // pocket check
  for(const b of balls){
    if(b.pocketed)continue;
    for(const p of pockets){
      const dx=b.x-p.x,dy=b.y-p.y;
      if(dx*dx+dy*dy<POCKET_R*POCKET_R){
        b.pocketed=true;b.vx=0;b.vy=0;
        playPocket();
        handlePocketed(b);
        updateUI();break;
      }
    }
  }
}

function handlePocketed(b){
  if(b.id===0){
    // foul
    if(gameMode==='cpu'){switchTurn();}
    else{score=Math.max(0,score-2);}
    setTimeout(()=>{b.pocketed=false;b.x=220;b.y=CANVAS_H/2;b.vx=0;b.vy=0;},1000);
    return;
  }
  if(gameMode==='solo'){score+=1;return;}
  // CPU mode
  if(b.id===8){
    // 8番: 自分のボールを全部入れていたら勝ち
    gameOver=true;
    const myDone=currentPlayer===1?P1_BALLS.every(id=>p1Pocketed.includes(id)):P2_BALLS.every(id=>p2Pocketed.includes(id));
    const winner=myDone?currentPlayer:(currentPlayer===1?2:1);
    setTimeout(()=>{
      const winName=winner===1?'🎉 あなたの勝ち！':'🤖 CPUの勝ち！';
      document.getElementById('msg-text').innerHTML=winName+'<br><small style="font-size:0.9rem">ショット数: '+shots+'</small>';
      document.getElementById('message-box').style.display='block';
      if(winner===1)playWin();
    },300);
    return;
  }
  const isP1=P1_BALLS.includes(b.id),isP2=P2_BALLS.includes(b.id);
  if(currentPlayer===1&&isP1){p1Pocketed.push(b.id);}
  else if(currentPlayer===2&&isP2){p2Pocketed.push(b.id);}
  else{
    if(isP1)p1Pocketed.push(b.id);
    if(isP2)p2Pocketed.push(b.id);
    // 相手球入れたらターン交代フラグ（afterShot時に処理）
  }
}

function switchTurn(){
  currentPlayer=currentPlayer===1?2:1;
  updateUI();
}

function afterShotStopped(){
  if(gameMode!=='cpu'||gameOver)return;
  const nowP=balls.filter(b=>b.pocketed&&b.id!==0).map(b=>b.id);
  const newlyP=nowP.filter(id=>!shotPocketedBefore.includes(id));
  const myBalls=currentPlayer===1?P1_BALLS:P2_BALLS;
  const scoredOwn=newlyP.some(id=>myBalls.includes(id));
  if(!scoredOwn)switchTurn();
  else updateUI();
  // CPUターンなら思考開始
  if(currentPlayer===2&&!gameOver){
    cpuThinking=true;
    document.getElementById('cpu-thinking').style.display='block';
    setTimeout(doCPUShot, 900+Math.random()*600);
  }
}

// ===================== CPU AI =====================
// 難易度パラメータ
const DIFF_PARAMS={
  easy:  {angleErr:0.22, powerErr:0.35, missChance:0.35, planAhead:false},
  normal:{angleErr:0.10, powerErr:0.18, missChance:0.15, planAhead:false},
  hard:  {angleErr:0.03, powerErr:0.06, missChance:0.02, planAhead:true}
};

function doCPUShot(){
  if(gameOver||currentPlayer!==2){cpuThinking=false;document.getElementById('cpu-thinking').style.display='none';return;}
  const params=DIFF_PARAMS[cpuDiff];
  const shot=calcCPUShot(params);
  if(shot){
    const noise=(()=>Math.random()*2-1);
    const angle=Math.atan2(shot.dy,shot.dx)+noise()*params.angleErr;
    let pwr=shot.power*(1+noise()*params.powerErr);
    pwr=Math.max(2,Math.min(maxPower,pwr));
    cueBall.vx=Math.cos(angle)*pwr;
    cueBall.vy=Math.sin(angle)*pwr;
    playCue(pwr);
    shots++;
    shotPocketedBefore=balls.filter(b=>b.pocketed&&b.id!==0).map(b=>b.id);
    isMoving=true;
  }
  cpuThinking=false;
  document.getElementById('cpu-thinking').style.display='none';
  updateUI();
}

function calcCPUShot(params){
  // 自分(CPU)のボール = ストライプ(9-15), 全部入ったら8番
  const myAlive=balls.filter(b=>!b.pocketed&&P2_BALLS.includes(b.id));
  const eight=balls.find(b=>b.id===8&&!b.pocketed);
  const allMyDone=P2_BALLS.every(id=>p2Pocketed.includes(id));
  const targets=allMyDone?(eight?[eight]:[]):myAlive;
  if(!targets.length||!cueBall||cueBall.pocketed)return null;
  // ランダムミス
  if(Math.random()<params.missChance){
    return randomShot();
  }
  // 各ターゲット×各ポケットの組み合わせでベストを探す
  let best=null,bestScore=-Infinity;
  for(const target of targets){
    for(const pocket of pockets){
      const shot=calcShotForBallPocket(target,pocket);
      if(!shot)continue;
      // スコア: ポケットへの角度が良いほど高い
      const dist1=Math.hypot(target.x-cueBall.x,target.y-cueBall.y);
      const dist2=Math.hypot(target.x-pocket.x,target.y-pocket.y);
      const s=1/(dist1+dist2+1)*100;
      if(s>bestScore){bestScore=s;best=shot;}
    }
  }
  return best||randomShot();
}

function calcShotForBallPocket(target,pocket){
  // ボールをポケット方向に押すためのキュー方向を計算
  const tx=target.x-pocket.x,ty=target.y-pocket.y;
  const tlen=Math.hypot(tx,ty);if(!tlen)return null;
  const tnx=tx/tlen,tny=ty/tlen;
  // ゴーストボール位置（キューボールがターゲットに当たる位置）
  const gx=target.x+tnx*BALL_R*2,gy=target.y+tny*BALL_R*2;
  // キューボールからゴーストボールへ
  const dx=gx-cueBall.x,dy=gy-cueBall.y;
  const dist=Math.hypot(dx,dy);if(dist<1)return null;
  // 障害物チェック（簡易）
  if(isBlocked(cueBall.x,cueBall.y,gx,gy,target.id))return null;
  const power=Math.min(maxPower,Math.max(4,dist*0.045+6));
  return {dx,dy,power};
}

function isBlocked(x1,y1,x2,y2,excludeId){
  for(const b of balls){
    if(b.pocketed||b.id===0||b.id===excludeId)continue;
    // 直線とボールの距離
    const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);
    if(!len)continue;
    const nx=dx/len,ny=dy/len;
    const ex=b.x-x1,ey=b.y-y1;
    const proj=ex*nx+ey*ny;
    if(proj<0||proj>len)continue;
    const perp=Math.abs(ex*ny-ey*nx);
    if(perp<BALL_R*2.1)return true;
  }
  return false;
}

function randomShot(){
  // テーブル中央方向にランダムショット
  const angle=Math.random()*Math.PI*2;
  const power=4+Math.random()*8;
  return{dx:Math.cos(angle),dy:Math.sin(angle),power};
}

// ===================== DRAW =====================
function drawTable(){
  ctx.fillStyle='#1a6636';ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
  ctx.fillStyle='#145228';
  ctx.fillRect(0,0,CANVAS_W,WALL_T);ctx.fillRect(0,WALL_B,CANVAS_W,CANVAS_H-WALL_B);
  ctx.fillRect(0,0,WALL_L,CANVAS_H);ctx.fillRect(WALL_R,0,CANVAS_W-WALL_R,CANVAS_H);
  ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(CANVAS_W/2,WALL_T);ctx.lineTo(CANVAS_W/2,WALL_B);ctx.stroke();
  ctx.beginPath();ctx.moveTo(WALL_L+180,WALL_T);ctx.lineTo(WALL_L+180,WALL_B);ctx.stroke();
  for(const p of pockets){
    const g=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,POCKET_R);
    g.addColorStop(0,'#050c08');g.addColorStop(1,'#0a1810');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,POCKET_R,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#7a5c2e';ctx.lineWidth=2;ctx.stroke();
  }
}

function lighten(h,a){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return `rgb(${Math.min(255,r+Math.round(a*255))},${Math.min(255,g+Math.round(a*255))},${Math.min(255,b+Math.round(a*255))})`;}
function darken(h,a){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return `rgb(${Math.max(0,r-Math.round(a*255))},${Math.max(0,g-Math.round(a*255))},${Math.max(0,b-Math.round(a*255))})`;}

function drawBall(b){
  if(b.pocketed)return;
  const x=b.x,y=b.y,r=BALL_R;
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();ctx.ellipse(x+3,y+4,r,r*0.6,0,0,Math.PI*2);ctx.fill();
  const grd=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
  if(b.id===0){grd.addColorStop(0,'#fff');grd.addColorStop(1,'#ccc');}
  else{grd.addColorStop(0,lighten(b.color,0.6));grd.addColorStop(0.5,b.color);grd.addColorStop(1,darken(b.color,0.5));}
  ctx.fillStyle=grd;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  if(b.id!==0){
    const cr=b.id>=10?r*0.76:r*0.64;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,cr,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=1;ctx.stroke();
    const fs=b.id>=10?r*0.84:r*1.02;
    ctx.font=`900 ${fs}px 'Arial Black',Arial,sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=b.color==='#303030'?'#111':darken(b.color,0.25);
    ctx.fillText(b.id,x,y+0.5);
  }
  // CPU target highlight
  if(gameMode==='cpu'&&currentPlayer===2&&!isMoving&&!cpuThinking){
    const myAlive=balls.filter(bl=>!bl.pocketed&&P2_BALLS.includes(bl.id));
    const allDone=P2_BALLS.every(id=>p2Pocketed.includes(id));
    if((allDone&&b.id===8)||(!allDone&&P2_BALLS.includes(b.id))){
      ctx.strokeStyle='rgba(255,80,0,0.35)';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(x,y,r+4,0,Math.PI*2);ctx.stroke();
    }
  }
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.beginPath();ctx.ellipse(x-r*0.28,y-r*0.3,r*0.22,r*0.14,-0.5,0,Math.PI*2);ctx.fill();
}

function drawCue(mx,my){
  if(!aiming||isMoving||cueBall.pocketed||currentPlayer===2)return;
  const cx=cueBall.x,cy=cueBall.y,dx=mx-cx,dy=my-cy;
  const dist=Math.hypot(dx,dy);if(dist<1)return;
  const nx=dx/dist,ny=dy/dist;
  ctx.save();ctx.setLineDash([8,8]);
  ctx.strokeStyle='rgba(255,255,220,0.35)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(cx+nx*BALL_R,cy+ny*BALL_R);ctx.lineTo(cx+nx*240,cy+ny*240);
  ctx.stroke();ctx.setLineDash([]);ctx.restore();
  const pb=(power/maxPower)*30+6;
  const cs={x:cx-nx*(BALL_R+pb),y:cy-ny*(BALL_R+pb)};
  const ce={x:cx-nx*(BALL_R+pb+220),y:cy-ny*(BALL_R+pb+220)};
  const pr={x:-ny,y:nx};
  ctx.save();
  const g=ctx.createLinearGradient(cs.x,cs.y,ce.x,ce.y);
  g.addColorStop(0,'#e8c870');g.addColorStop(0.3,'#c8a050');g.addColorStop(1,'#6a3010');
  ctx.strokeStyle=g;ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cs.x+pr.x*3.5,cs.y+pr.y*3.5);ctx.lineTo(ce.x+pr.x,ce.y+pr.y);ctx.stroke();
  ctx.strokeStyle='#e8c870';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(cs.x-pr.x*3.5,cs.y-pr.y*3.5);ctx.lineTo(ce.x-pr.x,ce.y-pr.y);ctx.stroke();
  ctx.fillStyle='#80d0f0';ctx.beginPath();ctx.arc(cs.x,cs.y,3.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ===================== GAME LOOP =====================
function checkGameOver(){
  const alive=balls.filter(b=>b.id!==0&&!b.pocketed).length;
  updateUI();
  if(gameMode==='solo'&&alive===0){
    gameOver=true;
    document.getElementById('msg-text').innerHTML=`🎉 クリア！<br>スコア: ${score}<br>ショット数: ${shots}`;
    document.getElementById('message-box').style.display='block';
    playWin();
  }
}

function gameLoop(){
  ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
  drawTable();
  if(isMoving){
    for(let i=0;i<3;i++)step();
    if(!ballsMoving()){
      isMoving=false;
      checkGameOver();
      if(!gameOver)afterShotStopped();
    }
  }
  for(const b of balls)drawBall(b);
  if(!isMoving)drawCue(mouseX,mouseY);
  animId=requestAnimationFrame(gameLoop);
}

// ===================== INPUT =====================
function getPos(e){
  const r=canvas.getBoundingClientRect();
  const sx=CANVAS_W/r.width,sy=CANVAS_H/r.height;
  if(e.changedTouches&&e.changedTouches.length)return{x:(e.changedTouches[0].clientX-r.left)*sx,y:(e.changedTouches[0].clientY-r.top)*sy};
  if(e.touches&&e.touches.length)return{x:(e.touches[0].clientX-r.left)*sx,y:(e.touches[0].clientY-r.top)*sy};
  return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy};
}
function startAim(e){
  if(isMoving||gameOver||currentPlayer===2)return;
  if(audioCtx.state==='suspended')audioCtx.resume();
  aiming=true;power=0;
  powerInterval=setInterval(()=>{
    if(!aiming)return;
    power=Math.min(power+0.3,maxPower);
    const p=Math.round(power/maxPower*100);
    document.getElementById('power-bar').style.width=p+'%';
    document.getElementById('power-val').textContent=p+'%';
  },30);
}
function shoot(e){
  if(!aiming)return;
  clearInterval(powerInterval);powerInterval=null;aiming=false;
  document.getElementById('power-bar').style.width='0%';
  document.getElementById('power-val').textContent='0%';
  if(cueBall.pocketed||isMoving)return;
  const pos=getPos(e);
  const dx=pos.x-cueBall.x,dy=pos.y-cueBall.y,dist=Math.hypot(dx,dy);
  if(dist<1||power<0.5)return;
  cueBall.vx=dx/dist*power;cueBall.vy=dy/dist*power;
  playCue(power);shots++;
  shotPocketedBefore=balls.filter(b=>b.pocketed&&b.id!==0).map(b=>b.id);
  isMoving=true;updateUI();
}
function cancelAim(){
  if(aiming){clearInterval(powerInterval);powerInterval=null;aiming=false;
    document.getElementById('power-bar').style.width='0%';document.getElementById('power-val').textContent='0%';}
}
canvas.addEventListener('mousedown',e=>{const p=getPos(e);mouseX=p.x;mouseY=p.y;startAim(e);});
canvas.addEventListener('mousemove',e=>{const p=getPos(e);mouseX=p.x;mouseY=p.y;});
canvas.addEventListener('mouseup',shoot);
canvas.addEventListener('mouseleave',cancelAim);
canvas.addEventListener('touchstart',e=>{e.preventDefault();const p=getPos(e);mouseX=p.x;mouseY=p.y;startAim(e);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const p=getPos(e);mouseX=p.x;mouseY=p.y;},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();shoot(e);},{passive:false});
syncAutoLayout();
fitCanvas();
</script>
