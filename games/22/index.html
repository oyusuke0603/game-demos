<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DASH HERO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: linear-gradient(160deg, #1a0533 0%, #0d1b4b 60%, #0a2a1a 100%);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
    font-family:'Fredoka One', cursive;
  }
  #wrap {
    position:relative;
    width:480px; height:640px;
    margin:0 auto;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 0 60px rgba(100,0,255,0.4), 0 0 120px rgba(0,200,100,0.15);
  }
  #wrap canvas { position:absolute; top:0; left:0; display:block; }
  #bgCanvas   { z-index:1; }
  #gameCanvas { z-index:2; }

  /* HUD */
  #hud {
    position:absolute; top:0; left:0; right:0; z-index:5;
    display:grid; grid-template-columns:1fr 1fr 1fr;
    padding:12px 16px 0;
    background:linear-gradient(to bottom,rgba(0,0,0,0.6),transparent);
    pointer-events:none;
  }
  .hi { font-size:11px; letter-spacing:1px; color:#aef; font-family:'Nunito',sans-serif; font-weight:700; text-transform:uppercase; }
  .hi:nth-child(2){ text-align:center; }
  .hi:nth-child(3){ text-align:right; }
  .hv { font-size:22px; font-weight:900; display:block; color:#fff; line-height:1.1; font-family:'Fredoka One',cursive; }

  /* Overlay */
  #overlay {
    position:absolute; inset:0; z-index:10;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:rgba(10,5,30,0.88); backdrop-filter:blur(4px);
    border-radius:16px;
  }
  #overlay h1 {
    font-size:58px; font-weight:900; letter-spacing:4px;
    text-align:center; width:100%;
    background:linear-gradient(135deg,#ffe14d,#ff7c2a,#ff3c6e);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,180,0,0.8));
    margin-bottom:6px; line-height:1;
  }
  .sub {
    font-family:'Nunito',sans-serif; font-size:12px; letter-spacing:3px;
    color:#ff9a3c; margin-bottom:28px; text-align:center;
  }
  .big-score { font-size:52px; color:#fff; margin-bottom:4px; text-align:center; }
  .score-lbl { font-family:'Nunito',sans-serif; font-size:11px; letter-spacing:3px; color:#aef; margin-bottom:28px; opacity:.8; text-align:center; }
  .btn {
    padding:14px 52px; font-family:'Fredoka One',cursive; font-size:18px;
    letter-spacing:3px; color:#fff;
    background:linear-gradient(135deg,#ff7c2a,#ff3c6e);
    border:none; cursor:pointer; border-radius:50px;
    box-shadow:0 4px 20px rgba(255,80,80,0.5);
    transition:transform .15s, box-shadow .15s;
    text-transform:uppercase;
  }
  .btn:hover { transform:scale(1.07); box-shadow:0 6px 30px rgba(255,80,80,0.7); }

  /* Stage banner */
  #stageBanner {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    z-index:8; font-size:38px;
    color:#ffe14d; text-shadow:0 0 24px #ff9900;
    letter-spacing:5px; pointer-events:none;
    opacity:0; transition:opacity .3s; text-align:center; white-space:nowrap;
  }
  #hint {
    margin-top:10px; font-family:'Nunito',sans-serif;
    font-size:11px; color:rgba(180,210,255,.4); letter-spacing:1px;
    text-align:center;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="bgCanvas"></canvas>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="hi">SCORE<span class="hv" id="scoreEl">0</span></div>
    <div class="hi">STAGE<span class="hv" id="stageEl">1</span></div>
    <div class="hi">BEST<span class="hv" id="bestEl">0</span></div>
  </div>

  <div id="stageBanner"></div>

  <div id="overlay">
    <h1>DASH<br>HERO</h1>
    <div class="sub">◈ OBSTACLE RUNNER ◈</div>
    <button class="btn" id="startBtn">START</button>
    <div id="hint">SPACE / TAP でジャンプ &nbsp;|&nbsp; 2回でダブルジャンプ</div>
  </div>
</div>

<script>
const W=480, H=640;
const bgCvs=document.getElementById('bgCanvas');
const bgCtx=bgCvs.getContext('2d');
const cvs=document.getElementById('gameCanvas');
const ctx=cvs.getContext('2d');
bgCvs.width=cvs.width=W;
bgCvs.height=cvs.height=H;

// ===== AUDIO =====
let _ac=null;
function getAC(){ if(!_ac)_ac=new AudioContext(); if(_ac.state==='suspended')_ac.resume(); return _ac; }
function playJump(d=false){
  try{
    const ac=getAC(), o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    const t=ac.currentTime;
    o.frequency.setValueAtTime(d?300:400,t);
    o.frequency.exponentialRampToValueAtTime(d?600:800,t+0.12);
    g.gain.setValueAtTime(0.13,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    o.start(t); o.stop(t+0.15);
  }catch(e){}
}
function playHit(){
  try{
    const ac=getAC();
    const len=Math.floor(ac.sampleRate*0.3);
    const buf=ac.createBuffer(1,len,ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.2);
    const src=ac.createBufferSource(),g=ac.createGain();
    src.buffer=buf; src.connect(g); g.connect(ac.destination);
    const t=ac.currentTime;
    g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    src.start(t);
  }catch(e){}
}
function playCoin(){
  try{
    const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();
    o.type='sine'; o.connect(g); g.connect(ac.destination);
    const t=ac.currentTime;
    o.frequency.setValueAtTime(880,t);
    o.frequency.setValueAtTime(1320,t+0.05);
    g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    o.start(t); o.stop(t+0.15);
  }catch(e){}
}

// ===== BG PARALLAX =====
const bgLayers=[
  { stars:[], speed:0.3 },
  { stars:[], speed:0.8 },
];
for(const layer of bgLayers){
  for(let i=0;i<60;i++) layer.stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+0.3});
}
// 遠景の木・建物
const bgBuildings=[];
for(let i=0;i<8;i++) bgBuildings.push({x:i*70+Math.random()*40,w:30+Math.random()*30,h:80+Math.random()*120,col:`hsl(${220+Math.random()*40},30%,${12+Math.random()*10}%)`});

function drawBg(scrollX){
  bgCtx.clearRect(0,0,W,H);
  // 夜空グラデ
  const grad=bgCtx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0e0020'); grad.addColorStop(0.6,'#0a1a40'); grad.addColorStop(1,'#0a2a10');
  bgCtx.fillStyle=grad; bgCtx.fillRect(0,0,W,H);

  // 星
  for(const layer of bgLayers){
    for(const s of layer.stars){
      const sx=((s.x - scrollX*layer.speed)%W+W)%W;
      bgCtx.beginPath(); bgCtx.arc(sx,s.y,s.r,0,Math.PI*2);
      bgCtx.fillStyle=`rgba(220,230,255,0.7)`; bgCtx.fill();
    }
  }
  // ビル
  for(const b of bgBuildings){
    const bx=((b.x - scrollX*0.15)%(W+100)+W+100)%(W+100)-50;
    bgCtx.fillStyle=b.col;
    bgCtx.fillRect(bx, H-GROUND_H-b.h, b.w, b.h);
    // 窓
    bgCtx.fillStyle='rgba(255,255,150,0.25)';
    for(let wy=4;wy<b.h-10;wy+=14){
      for(let wx=4;wx<b.w-8;wx+=10){
        if(Math.random()>0.4) bgCtx.fillRect(bx+wx, H-GROUND_H-b.h+wy, 6, 8);
      }
    }
  }
}

// ===== CONSTANTS =====
const GROUND_H=60;
const GROUND_Y=H-GROUND_H;
const GRAVITY=0.55;
const JUMP_V=-13;
const DOUBLE_JUMP_V=-11;

// ===== STATE =====
let state='menu';
let score=0, best=0, stage=1;
let scrollX=0, gameSpeed=4;
let stageClear=false;
let distGoal=1200, distRun=0;

// ===== PLAYER =====
let p={
  x:90, y:GROUND_Y-50, w:36, h:50,
  vy:0, onGround:false, jumps:0,
  frame:0, frameTimer:0,
  invincible:0, dead:false,
  trail:[]
};

// ===== OBJECTS =====
let obstacles=[], coins=[], particles=[];
let spawnTimer=0, coinTimer=0;

// ===== HUD =====
function hud(){
  document.getElementById('scoreEl').textContent=score;
  document.getElementById('stageEl').textContent=stage;
  document.getElementById('bestEl').textContent=best;
}

// ===== INIT =====
function init(){
  score=0; stage=1; scrollX=0;
  gameSpeed=4; distRun=0; distGoal=1200;
  p={x:90,y:GROUND_Y-50,w:36,h:50,vy:0,onGround:false,jumps:0,frame:0,frameTimer:0,invincible:0,dead:false,trail:[]};
  obstacles=[]; coins=[]; particles=[];
  spawnTimer=0; coinTimer=0; stageClear=false;
  hud();
}

// ===== OVERLAY =====
const overlay=document.getElementById('overlay');
function showOverlay(title,sub,sc,stg,btnTxt){
  overlay.innerHTML=`
    <h1>${title}</h1>
    <div class="sub">${sub}</div>
    ${sc!==null?`<div class="big-score">${sc}</div><div class="score-lbl">STAGE ${stg} | BEST ${best}</div>`:''}
    <button class="btn" id="startBtn">${btnTxt}</button>
    <div id="hint">SPACE / TAP でジャンプ &nbsp;|&nbsp; 2回でダブルジャンプ</div>`;
  document.getElementById('startBtn').onclick=startGame;
  overlay.style.display='flex';
}
document.getElementById('startBtn').onclick=startGame;
function startGame(){ overlay.style.display='none'; init(); state='playing'; }

// ===== STAGE BANNER =====
function stageFlash(n){
  const el=document.getElementById('stageBanner');
  el.textContent=`STAGE  ${n}`;
  el.style.opacity='1';
  setTimeout(()=>el.style.opacity='0',1400);
}

// ===== SPAWN =====
const OBS_TYPES=[
  // {type, w, h, col, hasTop}
  {id:'rock',   w:30,h:34,col:'#7a6a88'},
  {id:'spike',  w:26,h:40,col:'#e05050'},
  {id:'wall',   w:22,h:70,col:'#4466cc'},
  {id:'barrel', w:34,h:34,col:'#cc7733'},
  {id:'topbar', w:80,h:20,col:'#44bb66', yOff:-120}, // 上からの障害物
];
function spawnObstacle(){
  const spd = gameSpeed;
  // ステージが上がるほど難しいタイプも出る
  const pool = stage<3 ? [0,0,0,1,3] : stage<6 ? [0,1,1,2,3,4] : [0,1,2,2,3,3,4,4];
  const t = OBS_TYPES[pool[Math.floor(Math.random()*pool.length)]];
  const isTop = t.id==='topbar';
  obstacles.push({
    x: W+30,
    y: isTop ? GROUND_Y - 150 : GROUND_Y - t.h,
    w: t.w, h: t.h, col: t.col,
    spd, id: t.id
  });
}
function spawnCoin(){
  const y = GROUND_Y - 60 - Math.random()*80;
  coins.push({x:W+10, y, r:10, spd:gameSpeed, collected:false, anim:0});
}

// ===== PARTICLES =====
function burst(x,y,col,n=10){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=Math.random()*4+1;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,dec:0.04,r:Math.random()*4+2,col});
  }
}

// ===== DRAW PLAYER =====
function drawPlayer(){
  const px=p.x, py=p.y;
  // トレイル
  for(let i=p.trail.length-1;i>=0;i--){
    const t2=p.trail[i];
    ctx.globalAlpha=t2.a*0.35;
    ctx.fillStyle='#ffe14d';
    ctx.beginPath(); ctx.ellipse(t2.x+p.w/2,t2.y+p.h/2,p.w*0.35,p.h*0.35,0,0,Math.PI*2); ctx.fill();
    t2.a-=0.12; if(t2.a<=0) p.trail.splice(i,1);
  }
  ctx.globalAlpha=1;

  if(p.invincible>0 && Math.floor(p.invincible/5)%2===1){ return; }

  // 足（走りアニメ）
  p.frameTimer++;
  if(p.onGround && p.frameTimer>5){ p.frame=(p.frame+1)%4; p.frameTimer=0; }
  const legOffset=[0,6,0,-6][p.frame];

  ctx.save();
  ctx.translate(px+p.w/2, py+p.h/2);

  // 影
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(0,p.h/2+2,p.w*0.45,6,0,0,Math.PI*2); ctx.fill();

  // 体
  ctx.fillStyle='#ff7c2a';
  ctx.beginPath(); ctx.roundRect(-p.w/2+2,-p.h/2,p.w-4,p.h*0.6,8); ctx.fill();

  // 脚
  ctx.fillStyle='#cc3a10';
  ctx.fillRect(-10, p.h*0.1+legOffset, 10, p.h*0.4);
  ctx.fillRect(2,   p.h*0.1-legOffset, 10, p.h*0.4);

  // 頭
  ctx.fillStyle='#ffe14d';
  ctx.beginPath(); ctx.arc(0,-p.h*0.3,12,0,Math.PI*2); ctx.fill();

  // 目
  ctx.fillStyle='#222';
  ctx.beginPath(); ctx.arc(5,-p.h*0.32,3,0,Math.PI*2); ctx.fill();

  // ジャンプ中は腕を上げる
  if(!p.onGround){
    ctx.strokeStyle='#ff7c2a'; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-p.w/2+2,0); ctx.lineTo(-p.w/2-8,-10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.w/2-2,0); ctx.lineTo(p.w/2+8,-10); ctx.stroke();
  } else {
    ctx.strokeStyle='#ff7c2a'; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-p.w/2+2,0); ctx.lineTo(-p.w/2-8,8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.w/2-2,0); ctx.lineTo(p.w/2+8,8); ctx.stroke();
  }

  ctx.restore();
}

// ===== DRAW OBSTACLE =====
function drawObstacle(o){
  ctx.save();
  ctx.shadowColor=o.col; ctx.shadowBlur=10;
  ctx.fillStyle=o.col;
  if(o.id==='spike'){
    // 三角スパイク
    ctx.beginPath();
    ctx.moveTo(o.x+o.w/2, o.y);
    ctx.lineTo(o.x+o.w, o.y+o.h);
    ctx.lineTo(o.x, o.y+o.h);
    ctx.closePath(); ctx.fill();
  } else if(o.id==='barrel'){
    ctx.beginPath(); ctx.ellipse(o.x+o.w/2,o.y+o.h/2,o.w/2,o.h/2,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(o.x,o.y+o.h/2); ctx.lineTo(o.x+o.w,o.y+o.h/2); ctx.stroke();
  } else if(o.id==='topbar'){
    ctx.fillRect(o.x,o.y,o.w,o.h);
    // ハング棒
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.fillRect(o.x,o.y,o.w,4);
  } else {
    ctx.beginPath(); ctx.roundRect(o.x,o.y,o.w,o.h,4); ctx.fill();
  }
  ctx.shadowBlur=0; ctx.restore();
}

// ===== DRAW COIN =====
function drawCoin(c){
  c.anim+=0.1;
  ctx.save();
  ctx.translate(c.x,c.y);
  ctx.shadowColor='#ffe14d'; ctx.shadowBlur=14;
  ctx.fillStyle='#ffe14d';
  // コインはx方向にスケールで回転感
  const sx=Math.abs(Math.cos(c.anim));
  ctx.scale(sx,1);
  ctx.beginPath(); ctx.arc(0,0,c.r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffaa00';
  ctx.font='bold 10px Fredoka One'; ctx.textAlign='center'; ctx.textBaseline='middle';
  if(sx>0.3) ctx.fillText('★',0,0);
  ctx.shadowBlur=0; ctx.restore();
}

// ===== DRAW GROUND =====
function drawGround(){
  // 地面グラデ
  const g=ctx.createLinearGradient(0,GROUND_Y,0,H);
  g.addColorStop(0,'#1a7a3a'); g.addColorStop(0.3,'#145a2a'); g.addColorStop(1,'#0a2a10');
  ctx.fillStyle=g; ctx.fillRect(0,GROUND_Y,W,GROUND_H);
  // ライン
  ctx.strokeStyle='rgba(100,255,150,0.25)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,GROUND_Y); ctx.lineTo(W,GROUND_Y); ctx.stroke();
  // 走行ライン（スクロール）
  ctx.strokeStyle='rgba(100,255,150,0.12)'; ctx.lineWidth=1;
  for(let i=0;i<6;i++){
    const lx=((i*90 - scrollX*0.5)%(W+90)+W+90)%(W+90)-40;
    ctx.beginPath(); ctx.moveTo(lx,GROUND_Y+10); ctx.lineTo(lx+50,GROUND_Y+10); ctx.stroke();
  }
}

// ===== PROGRESS BAR =====
function drawProgress(){
  const bw=W-80, bx=40, by=H-14;
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.roundRect(bx,by,bw,6,3); ctx.fill();
  const ratio=Math.min(distRun/distGoal,1);
  const grad=ctx.createLinearGradient(bx,0,bx+bw,0);
  grad.addColorStop(0,'#ffe14d'); grad.addColorStop(1,'#ff3c6e');
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.roundRect(bx,by,bw*ratio,6,3); ctx.fill();
  // ゴールフラグ
  ctx.fillStyle='#ffe14d'; ctx.font='14px serif';
  ctx.fillText('🏁',bx+bw-4,by+6);
}

// ===== COLLISION =====
function rectsHit(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}

// ===== JUMP =====
function doJump(){
  if(p.dead) return;
  if(p.jumps===0 && p.onGround){
    p.vy=JUMP_V; p.onGround=false; p.jumps=1;
    playJump(false);
    p.trail.push({x:p.x,y:p.y,a:1});
  } else if(p.jumps===1){
    p.vy=DOUBLE_JUMP_V; p.jumps=2;
    playJump(true);
    burst(p.x+p.w/2,p.y+p.h,'#ffe14d',8);
  }
}

// ===== MAIN LOOP =====
let raf;
function loop(){
  raf=requestAnimationFrame(loop);
  drawBg(scrollX);
  ctx.clearRect(0,0,W,H);
  drawGround();

  if(state!=='playing') return;

  // スクロール
  scrollX+=gameSpeed;
  distRun+=gameSpeed;

  // ステージクリア判定
  if(!stageClear && distRun>=distGoal){
    stageClear=true;
    setTimeout(()=>{
      stage++;
      gameSpeed=4+stage*0.5;
      distGoal=1200+stage*400;
      distRun=0;
      obstacles=[]; coins=[];
      stageClear=false;
      hud();
      stageFlash(stage);
    },800);
  }

  // 自機物理
  if(!p.dead){
    p.vy+=GRAVITY;
    p.y+=p.vy;
    if(p.y>=GROUND_Y-p.h){
      p.y=GROUND_Y-p.h; p.vy=0; p.onGround=true; p.jumps=0;
    } else {
      p.onGround=false;
    }
    if(p.invincible>0) p.invincible--;

    // トレイル（空中）
    if(!p.onGround && Math.random()>0.6) p.trail.push({x:p.x,y:p.y,a:0.8});
  }

  // スポーン
  if(!stageClear){
    spawnTimer--;
    const interval=Math.max(38, 90-stage*5);
    if(spawnTimer<=0){ spawnObstacle(); spawnTimer=interval+Math.floor(Math.random()*30); }
    coinTimer--;
    if(coinTimer<=0){ spawnCoin(); coinTimer=60+Math.floor(Math.random()*40); }
  }

  // 障害物
  obstacles=obstacles.filter(o=>{
    o.x-=o.spd;
    if(o.x<-100) return false;
    // 衝突
    if(p.invincible===0 && !p.dead &&
       rectsHit(p.x+6,p.y+6,p.w-12,p.h-8, o.x,o.y,o.w,o.h)){
      playHit();
      burst(p.x+p.w/2,p.y+p.h/2,'#ff3c6e',16);
      p.dead=true;
      if(score>best) best=score;
      setTimeout(()=>{
        state='gameover';
        showOverlay('GAME<br>OVER','◈ TRY AGAIN ◈',score,stage,'RETRY');
      },700);
    }
    drawObstacle(o);
    return true;
  });

  // コイン
  coins=coins.filter(c=>{
    c.x-=c.spd;
    if(c.x<-20) return false;
    if(!c.collected && rectsHit(p.x+4,p.y+4,p.w-8,p.h-8, c.x-c.r,c.y-c.r,c.r*2,c.r*2)){
      playCoin(); burst(c.x,c.y,'#ffe14d',8);
      score+=10*(stage); hud();
      return false;
    }
    drawCoin(c);
    return true;
  });

  // パーティクル
  particles=particles.filter(pt=>{
    pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.15; pt.life-=pt.dec;
    if(pt.life<=0) return false;
    ctx.globalAlpha=pt.life;
    ctx.fillStyle=pt.col;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r*pt.life,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    return true;
  });

  // 自機
  drawPlayer();
  drawProgress();

  // スコア自動加算（走った距離）
  if(!p.dead && !stageClear){
    score++;
    if(score%10===0) hud();
  }
}

// ===== INPUT =====
window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); doJump(); }
});
cvs.addEventListener('touchstart',e=>{ e.preventDefault(); doJump(); },{passive:false});
cvs.addEventListener('click',()=>doJump());

// ===== START =====
loop();
</script>
</body>
</html>
