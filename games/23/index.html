<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLAM SHOT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;900&display=swap');
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background:#0a0a1a;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
    font-family:'Bungee',cursive;
  }
  #wrap{
    position:relative; width:420px; height:640px;
    margin:0 auto; overflow:hidden; border-radius:12px;
    box-shadow:0 0 60px rgba(255,120,0,0.35),0 0 120px rgba(255,60,0,0.1);
  }
  #wrap canvas{ position:absolute; top:0; left:0; display:block; }
  #bgCanvas{ z-index:1; }
  #gameCanvas{ z-index:2; cursor:crosshair; }
  #hud{
    position:absolute; top:0; left:0; right:0; z-index:5;
    display:grid; grid-template-columns:1fr 1fr 1fr;
    padding:12px 16px 0;
    background:linear-gradient(to bottom,rgba(0,0,0,0.7),transparent);
    pointer-events:none;
  }
  .hi{ font-size:10px; letter-spacing:1px; color:#ffa040; font-family:'Nunito',sans-serif; font-weight:700; text-transform:uppercase; }
  .hi:nth-child(2){ text-align:center; }
  .hi:nth-child(3){ text-align:right; }
  .hv{ font-size:24px; font-weight:900; display:block; color:#fff; line-height:1.1; font-family:'Bungee',cursive; }
  #overlay{
    position:absolute; inset:0; z-index:10;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:rgba(5,5,20,0.9); backdrop-filter:blur(4px);
    border-radius:12px;
  }
  #overlay h1{
    font-size:52px; letter-spacing:3px; line-height:1;
    text-align:center; width:100%;
    background:linear-gradient(135deg,#ff8c00,#ff4400,#ffcc00);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 20px rgba(255,120,0,0.9));
    margin-bottom:6px;
  }
  .sub{ font-family:'Nunito',sans-serif; font-size:12px; letter-spacing:3px; color:#ff8c00; margin-bottom:28px; text-align:center; }
  .big-score{ font-size:56px; color:#fff; margin-bottom:4px; text-align:center; }
  .score-lbl{ font-family:'Nunito',sans-serif; font-size:11px; letter-spacing:3px; color:#ffa040; margin-bottom:28px; opacity:.8; text-align:center; }
  .btn{
    padding:14px 52px; font-family:'Bungee',cursive; font-size:17px;
    letter-spacing:3px; color:#fff;
    background:linear-gradient(135deg,#ff6600,#ff2200);
    border:none; cursor:pointer; border-radius:50px;
    box-shadow:0 4px 24px rgba(255,80,0,0.6);
    transition:transform .15s, box-shadow .15s;
  }
  .btn:hover{ transform:scale(1.07); box-shadow:0 6px 32px rgba(255,80,0,0.8); }
  #hint{ margin-top:12px; font-family:'Nunito',sans-serif; font-size:11px; color:rgba(255,180,100,.4); letter-spacing:1px; text-align:center; }
  #popup{
    position:absolute; top:38%; left:50%; transform:translate(-50%,-50%);
    z-index:8; font-size:38px; font-family:'Bungee',cursive;
    pointer-events:none; opacity:0; transition:opacity .2s;
    text-align:center; white-space:nowrap; text-shadow:0 0 30px currentColor;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="bgCanvas"></canvas>
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div class="hi">SCORE<span class="hv" id="scoreEl">0</span></div>
    <div class="hi">TIME<span class="hv" id="timeEl">30</span></div>
    <div class="hi">BEST<span class="hv" id="bestEl">0</span></div>
  </div>
  <div id="popup"></div>
  <div id="overlay">
    <h1>SLAM<br>SHOT</h1>
    <div class="sub">◈ BASKETBALL ◈</div>
    <button class="btn" id="startBtn">START</button>
    <div id="hint">クリック長押し → 離してシュート！</div>
  </div>
</div>

<script>
const W=420, H=640;
const bgCvs=document.getElementById('bgCanvas');
const bgCtx=bgCvs.getContext('2d');
const cvs=document.getElementById('gameCanvas');
const ctx=cvs.getContext('2d');
bgCvs.width=cvs.width=W;
bgCvs.height=cvs.height=H;

// ===== AUDIO =====
let _ac=null;
function getAC(){ if(!_ac)_ac=new AudioContext(); if(_ac.state==='suspended')_ac.resume(); return _ac; }
function playSwish(){
  try{
    const ac=getAC();
    [500,800,1100].forEach((f,i)=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine'; o.connect(g); g.connect(ac.destination);
      const t=ac.currentTime+i*0.07;
      o.frequency.setValueAtTime(f,t);
      o.frequency.exponentialRampToValueAtTime(f*0.4,t+0.2);
      g.gain.setValueAtTime(0.13,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
      o.start(t); o.stop(t+0.2);
    });
  }catch(e){}
}
function playBounce(){
  try{
    const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();
    o.type='sine'; o.connect(g); g.connect(ac.destination);
    const t=ac.currentTime;
    o.frequency.setValueAtTime(200,t); o.frequency.exponentialRampToValueAtTime(60,t+0.14);
    g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
    o.start(t); o.stop(t+0.14);
  }catch(e){}
}
function playMiss(){
  try{
    const ac=getAC(),o=ac.createOscillator(),g=ac.createGain();
    o.type='sawtooth'; o.connect(g); g.connect(ac.destination);
    const t=ac.currentTime;
    o.frequency.setValueAtTime(200,t); o.frequency.exponentialRampToValueAtTime(70,t+0.22);
    g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
    o.start(t); o.stop(t+0.22);
  }catch(e){}
}

// ===== BG =====
function drawBg(){
  bgCtx.clearRect(0,0,W,H);
  const g=bgCtx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a0a00'); g.addColorStop(0.5,'#2a1200'); g.addColorStop(1,'#3a1800');
  bgCtx.fillStyle=g; bgCtx.fillRect(0,0,W,H);
  const floor=bgCtx.createLinearGradient(0,H*0.55,0,H);
  floor.addColorStop(0,'#8b4513'); floor.addColorStop(1,'#5a2d0c');
  bgCtx.fillStyle=floor; bgCtx.fillRect(0,H*0.55,W,H*0.45);
  bgCtx.strokeStyle='rgba(255,200,100,0.18)'; bgCtx.lineWidth=2;
  bgCtx.beginPath(); bgCtx.moveTo(40,H*0.72); bgCtx.lineTo(W-40,H*0.72); bgCtx.stroke();
  bgCtx.beginPath(); bgCtx.arc(W/2,H*0.72,80,0,Math.PI); bgCtx.stroke();
  const spot=bgCtx.createRadialGradient(W/2,H*0.35,0,W/2,H*0.35,200);
  spot.addColorStop(0,'rgba(255,160,60,0.1)'); spot.addColorStop(1,'rgba(0,0,0,0)');
  bgCtx.fillStyle=spot; bgCtx.fillRect(0,0,W,H);
}

// ===== CONSTANTS =====
const GRAVITY = 0.32;
const BALL_R  = 18;
const RIM_W   = 68;
const RIM_H   = 6;
const NET_H   = 38;
// ボール初期位置（画面下中央）
const BALL_START_X = W/2;
const BALL_START_Y = H - 90;

// ===== STATE =====
let state='menu';
let score=0, best=0, timeLeft=30;
let combo=0, comboTimer=0;
let timerInterval=null;

// ===== BALL =====
let ball={
  x:BALL_START_X, y:BALL_START_Y, r:BALL_R,
  vx:0, vy:0, flying:false,
  scored:false, missed:false, rotation:0
};

// ===== GOAL =====
let goal={ x:W/2-RIM_W/2, y:155, vx:1.5, passed:false };

// ===== AIM =====
// マウス押しっぱなし中にパワーが溜まる方式
let aim={
  active:false,   // 押している
  mx:0, my:0,     // マウス現在位置
  power:0         // 0〜1 溜まり具合
};

// ===== PARTICLES =====
let particles=[];

// ===== HUD =====
function hud(){
  document.getElementById('scoreEl').textContent=score;
  document.getElementById('timeEl').textContent=timeLeft;
  document.getElementById('bestEl').textContent=best;
}

// ===== POPUP =====
let popupTimer=0;
function showPopup(txt,col){
  const el=document.getElementById('popup');
  el.textContent=txt; el.style.color=col; el.style.opacity='1';
  popupTimer=70;
}

// ===== CONFETTI =====
function confetti(x,y){
  const cols=['#ff8c00','#ffcc00','#ff4400','#fff','#ff6699','#00ffcc'];
  for(let i=0;i<24;i++){
    const a=Math.random()*Math.PI*2, sp=Math.random()*8+2;
    particles.push({
      x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-3,
      life:1, dec:0.022, r:Math.random()*5+2,
      col:cols[Math.floor(Math.random()*cols.length)],
      rot:Math.random()*Math.PI*2, rotV:(Math.random()-.5)*0.3
    });
  }
}

// ===== RESET BALL =====
function resetBall(){
  ball.x=BALL_START_X; ball.y=BALL_START_Y;
  ball.vx=0; ball.vy=0;
  ball.flying=false; ball.scored=false; ball.missed=false;
  ball.rotation=0;
  aim.active=false; aim.power=0;
  goal.passed=false;
}

// ===== INIT =====
function init(){
  score=0; timeLeft=30; combo=0; comboTimer=0;
  goal.x=W/2-RIM_W/2; goal.y=155; goal.vx=1.5; goal.passed=false;
  particles=[];
  resetBall();
  hud();
  if(timerInterval) clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    if(state!=='playing') return;
    timeLeft--;
    hud();
    if(timeLeft<=0){
      clearInterval(timerInterval);
      if(score>best) best=score;
      state='gameover';
      setTimeout(()=>showOverlay('TIME<br>UP','◈ FINAL SCORE ◈',score,'RETRY'),400);
    }
  },1000);
}

// ===== OVERLAY =====
const overlay=document.getElementById('overlay');
function showOverlay(title,sub,sc,btnTxt){
  overlay.innerHTML=`
    <h1>${title}</h1><div class="sub">${sub}</div>
    ${sc!==null?`<div class="big-score">${sc}</div><div class="score-lbl">BEST ${best}</div>`:''}
    <button class="btn" id="startBtn">${btnTxt}</button>
    <div id="hint">クリック長押し → 離してシュート！</div>`;
  document.getElementById('startBtn').onclick=startGame;
  overlay.style.display='flex';
}
document.getElementById('startBtn').onclick=startGame;
function startGame(){ overlay.style.display='none'; init(); state='playing'; }

// ===== DRAW BALL =====
function drawBall(){
  const b=ball;
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.rotation);
  // グラデ
  const grad=ctx.createRadialGradient(-5,-6,2,0,0,b.r);
  grad.addColorStop(0,'#ffaa44');
  grad.addColorStop(0.55,'#e05500');
  grad.addColorStop(1,'#7a1a00');
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.fill();
  // ライン
  ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,-b.r); ctx.lineTo(0,b.r); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-b.r,0); ctx.lineTo(b.r,0); ctx.stroke();
  ctx.beginPath(); ctx.arc(-b.r*0.45,0,b.r*0.72,Math.PI*0.18,Math.PI*0.82); ctx.stroke();
  ctx.beginPath(); ctx.arc( b.r*0.45,0,b.r*0.72,Math.PI*1.18,Math.PI*1.82); ctx.stroke();
  // ハイライト
  ctx.fillStyle='rgba(255,255,255,0.22)';
  ctx.beginPath(); ctx.ellipse(-5,-7,6,4,0.5,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// ===== DRAW GOAL =====
function drawGoal(){
  const g=goal;
  const cx=g.x+RIM_W/2;
  // バックボード
  ctx.fillStyle='rgba(255,255,255,0.1)';
  ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(cx-28,g.y-58,56,42,3); ctx.fill(); ctx.stroke();
  // ポール
  ctx.strokeStyle='#999'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(cx,g.y-58); ctx.lineTo(cx,g.y-14); ctx.stroke();
  // リム（後ろ）
  ctx.strokeStyle='#bb3300'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(g.x,g.y); ctx.lineTo(g.x+RIM_W,g.y); ctx.stroke();
  // ネット
  ctx.lineWidth=1;
  for(let i=0;i<=7;i++){
    const nx=g.x+i*(RIM_W/7);
    const sw=Math.sin(Date.now()*0.003+i)*2;
    ctx.strokeStyle='rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.moveTo(nx,g.y);
    ctx.quadraticCurveTo(nx+sw, g.y+NET_H*0.5, cx+(nx-cx)*0.35, g.y+NET_H);
    ctx.stroke();
  }
  for(let row=1;row<=3;row++){
    const ry=g.y+NET_H*(row/4);
    const s=(row/4)*0.28;
    ctx.beginPath();
    ctx.moveTo(g.x+RIM_W*s*0.5, ry);
    ctx.lineTo(g.x+RIM_W*(1-s*0.5), ry);
    ctx.stroke();
  }
  // リム（前）
  ctx.strokeStyle='#ff5500'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(g.x,g.y+4); ctx.lineTo(g.x+RIM_W,g.y+4); ctx.stroke();
}

// ===== DRAW AIM LINE =====
// マウス位置を向いた放物線軌跡＋パワーゲージ
function drawAimLine(){
  if(!aim.active || ball.flying) return;

  // ボールからマウスへの方向ベクトルを計算
  const dx=aim.mx - ball.x;
  const dy=aim.my - ball.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<5) return;

  // パワーに応じた初速（最大18）
  const spd=6+aim.power*12;
  const vx=(dx/dist)*spd;
  const vy=(dy/dist)*spd;

  // 軌跡点線
  ctx.save();
  ctx.setLineDash([5,9]);
  ctx.strokeStyle='rgba(255,210,80,0.5)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(ball.x, ball.y);
  let px=ball.x, py=ball.y, pvx=vx, pvy=vy;
  for(let i=0;i<35;i++){
    pvy+=GRAVITY; px+=pvx; py+=pvy;
    if(py>H||px<0||px>W) break;
    ctx.lineTo(px,py);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // パワーゲージ（ボール下）
  const gx=ball.x-35, gy=ball.y+ball.r+10;
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(gx,gy,70,8,4); ctx.fill();
  const grad=ctx.createLinearGradient(gx,0,gx+70,0);
  grad.addColorStop(0,'#44ff88'); grad.addColorStop(0.6,'#ffcc00'); grad.addColorStop(1,'#ff3300');
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.roundRect(gx,gy,70*aim.power,8,4); ctx.fill();
  // ゲージ枠
  ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(gx,gy,70,8,4); ctx.stroke();

  // マウス位置に照準
  ctx.strokeStyle='rgba(255,210,80,0.7)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(aim.mx,aim.my,10,0,Math.PI*2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(aim.mx-14,aim.my); ctx.lineTo(aim.mx-6,aim.my);
  ctx.moveTo(aim.mx+6, aim.my); ctx.lineTo(aim.mx+14,aim.my);
  ctx.moveTo(aim.mx,aim.my-14); ctx.lineTo(aim.mx,aim.my-6);
  ctx.moveTo(aim.mx,aim.my+6);  ctx.lineTo(aim.mx,aim.my+14);
  ctx.stroke();
  ctx.restore();
}

// ===== LAUNCH =====
function launch(){
  if(!aim.active||ball.flying||ball.scored||ball.missed) return;
  const dx=aim.mx-ball.x, dy=aim.my-ball.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<5){ aim.active=false; aim.power=0; return; }
  // パワーを速度に変換
  const spd=6+aim.power*12;
  ball.vx=(dx/dist)*spd;
  ball.vy=(dy/dist)*spd;
  ball.flying=true;
  aim.active=false; aim.power=0;
  goal.passed=false;
}

// ===== SCORE CHECK =====
function checkScore(){
  const rimL=goal.x+4, rimR=goal.x+RIM_W-4;
  const rimY=goal.y+2;
  if(!goal.passed && ball.vy>0 &&
     ball.y+ball.r>=rimY && ball.y-ball.r<=rimY+NET_H*0.3 &&
     ball.x>rimL+ball.r*0.5 && ball.x<rimR-ball.r*0.5){
    goal.passed=true;
    ball.scored=true;
    combo++;
    comboTimer=200;
    const pts=combo>=3?3:combo>=2?2:1;
    score+=pts*10;
    if(score>best) best=score;
    hud();
    playSwish();
    confetti(ball.x, goal.y);
    if(combo>=3)      showPopup(`🔥 ${combo}COMBO!  +${pts*10}`,'#ffcc00');
    else if(combo>=2) showPopup(`✨ NICE!  +${pts*10}`,'#ff8c00');
    else              showPopup(`🏀 IN!  +${pts*10}`,'#ffffff');
    setTimeout(resetBall, 700);
  }
}

// ===== MAIN LOOP =====
function loop(){
  requestAnimationFrame(loop);
  drawBg();
  ctx.clearRect(0,0,W,H);

  // ゴール移動
  if(state==='playing'){
    const spd=Math.min(1.5+score*0.01, 5);
    goal.x+=goal.vx*(spd/1.5);
    if(goal.x<10||goal.x+RIM_W>W-10) goal.vx*=-1;
    // 100点超えたら上下にも動く
    if(score>=100){
      goal.y+=Math.sin(Date.now()*0.0012)*0.5;
      goal.y=Math.max(110,Math.min(220,goal.y));
    }
  }

  drawGoal();

  if(state==='playing'){
    // パワー蓄積
    if(aim.active && !ball.flying){
      aim.power=Math.min(aim.power+0.018, 1);
    }

    // 物理
    if(ball.flying && !ball.scored && !ball.missed){
      ball.vy+=GRAVITY;
      ball.x+=ball.vx;
      ball.y+=ball.vy;
      ball.rotation+=ball.vx*0.05;
      // 壁バウンド
      if(ball.x<ball.r){ ball.x=ball.r; ball.vx*=-0.55; playBounce(); }
      if(ball.x>W-ball.r){ ball.x=W-ball.r; ball.vx*=-0.55; playBounce(); }
      // 画面外（ミス）
      if(ball.y>H+40||ball.y<-60){
        ball.missed=true; combo=0; playMiss();
        setTimeout(resetBall,300);
      }
      checkScore();
    }

    // comboタイマー
    if(comboTimer>0){ comboTimer--; if(comboTimer===0) combo=0; }
    // popupフェード
    if(popupTimer>0){ popupTimer--; if(popupTimer===0) document.getElementById('popup').style.opacity='0'; }
  }

  // パーティクル
  particles=particles.filter(pt=>{
    pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.2; pt.life-=pt.dec; pt.rot+=pt.rotV;
    if(pt.life<=0) return false;
    ctx.save(); ctx.globalAlpha=pt.life;
    ctx.translate(pt.x,pt.y); ctx.rotate(pt.rot);
    ctx.fillStyle=pt.col; ctx.fillRect(-pt.r/2,-pt.r/2,pt.r,pt.r);
    ctx.restore(); ctx.globalAlpha=1;
    return true;
  });

  drawAimLine();
  drawBall();
}

// ===== INPUT =====
function getPos(e){
  const rect=cvs.getBoundingClientRect();
  const src=e.touches?e.touches[0]:e;
  return { x:(src.clientX-rect.left)*(W/rect.width), y:(src.clientY-rect.top)*(H/rect.height) };
}

cvs.addEventListener('mousedown',e=>{
  if(state!=='playing'||ball.flying||ball.scored||ball.missed) return;
  const p=getPos(e);
  aim.active=true; aim.power=0; aim.mx=p.x; aim.my=p.y;
});
cvs.addEventListener('mousemove',e=>{
  const p=getPos(e);
  aim.mx=p.x; aim.my=p.y;
});
cvs.addEventListener('mouseup',e=>{
  if(state!=='playing') return;
  launch();
});

cvs.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(state!=='playing'||ball.flying||ball.scored||ball.missed) return;
  const p=getPos(e);
  aim.active=true; aim.power=0; aim.mx=p.x; aim.my=p.y;
},{passive:false});
cvs.addEventListener('touchmove',e=>{
  e.preventDefault();
  const p=getPos(e); aim.mx=p.x; aim.my=p.y;
},{passive:false});
cvs.addEventListener('touchend',e=>{
  e.preventDefault();
  if(state!=='playing') return;
  launch();
},{passive:false});

// ===== START =====
drawBg();
loop();
</script>
</body>
</html>
