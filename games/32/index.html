<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ブラウザで動く タイピングシューティングゲーム</title>
<style>
  :root{
    --bg-deep:#05060f;
    --bg-panel:#0d1024;
    --accent-cyan:#4be3ff;
    --accent-magenta:#ff4bd8;
    --accent-yellow:#ffe14b;
    --accent-green:#4bff9e;
    --accent-red:#ff5a5a;
    --text-main:#eaf2ff;
    --text-dim:#7f8bb3;
    --key-bg:#171b34;
    --key-border:#2c3560;
    --f-lpinky:#ff6b6b;
    --f-lring:#ffa64b;
    --f-lmiddle:#ffe14b;
    --f-lindex:#7dff8a;
    --f-rindex:#4bfff0;
    --f-rmiddle:#4b9eff;
    --f-rring:#a24bff;
    --f-rpinky:#ff4bd8;
    --f-thumb:#6b7189;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    overflow:hidden;overscroll-behavior:none;
    background:var(--bg-deep);
    color:var(--text-main);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    touch-action:none;
  }
  #app{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    height:100dvh;width:100vw;
    background:radial-gradient(ellipse at 50% 0%, #12163a 0%, #05060f 70%);
  }
  /* ---------- HUD ---------- */
  #hud{
    display:flex;justify-content:space-between;align-items:center;
    padding:6px 12px;flex:0 0 auto;
    font-size:13px;font-weight:bold;letter-spacing:.05em;
    background:linear-gradient(180deg,rgba(13,16,36,.95),rgba(13,16,36,.4));
    border-bottom:1px solid var(--key-border);
    z-index:5;
  }
  #hud .grp{display:flex;gap:14px;align-items:center;}
  #hud .lives{color:var(--accent-red);}
  #hud .score{color:var(--accent-yellow);}
  #hud .combo{color:var(--accent-magenta);}
  #hud .level{color:var(--accent-cyan);}
  #titleTag{font-size:11px;color:var(--text-dim);font-weight:normal;}

  /* ---------- Canvas area ---------- */
  #stageWrap{
    position:relative;flex:1 1 auto;min-height:0;
    display:flex;align-items:stretch;justify-content:center;
  }
  #stage{display:block;width:100%;height:100%;}

  /* ---------- Overlays (start / pause / gameover) ---------- */
  .overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(5,6,15,.88);
    text-align:center;padding:16px;gap:10px;z-index:20;
    backdrop-filter:blur(2px);
  }
  .overlay.hidden{display:none;}
  .overlay h1{
    font-size:clamp(20px,5vw,32px);margin:0 0 4px;
    background:linear-gradient(90deg,var(--accent-cyan),var(--accent-magenta));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:.04em;
  }
  .overlay p{margin:2px 0;color:var(--text-dim);font-size:13px;max-width:420px;line-height:1.7;}
  .overlay .big{font-size:clamp(26px,6vw,40px);color:var(--accent-yellow);margin:6px 0;font-weight:bold;}
  .diffRow{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center;}
  .btn{
    appearance:none;border:1px solid var(--accent-cyan);color:var(--accent-cyan);
    background:rgba(75,227,255,.08);padding:9px 18px;border-radius:8px;
    font-size:14px;font-weight:bold;cursor:pointer;letter-spacing:.03em;
  }
  .btn.primary{background:var(--accent-cyan);color:#03121a;}
  .btn.mag{border-color:var(--accent-magenta);color:var(--accent-magenta);}
  .btn.mag.primary{background:var(--accent-magenta);color:#1a0313;}
  .btn:active{transform:scale(.96);}

  /* ---------- typing display ---------- */
  #typeRow{
    flex:0 0 auto;padding:3px 10px;
    display:flex;align-items:center;justify-content:center;
    min-height:20px;
  }
  #typeBuffer{
    font-size:14px;letter-spacing:.06em;color:var(--text-dim);
    background:var(--bg-panel);border:1px solid var(--key-border);
    padding:4px 12px;border-radius:18px;min-width:60px;text-align:center;
  }
  #typeBuffer .ok{color:var(--accent-green);}

  /* ---------- Keyboard ---------- */
  #kbWrap{
    flex:0 0 auto;padding:2px 6px 5px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    background:linear-gradient(0deg,rgba(13,16,36,.95),rgba(13,16,36,.5));
    border-top:1px solid var(--key-border);
  }
  #fingerLabel{
    font-size:10px;color:var(--text-dim);height:12px;letter-spacing:.05em;
  }
  #fingerLabel b{font-weight:bold;}
  .krow{display:flex;gap:2px;justify-content:center;width:100%;}
  #row1{margin-top:12px;}
  #row2{margin-top:12px;}
  .key{
    flex:1 1 0;max-width:34px;min-width:14px;
    aspect-ratio:1/0.46;
    display:flex;align-items:center;justify-content:center;
    background:var(--key-bg);border:1px solid var(--key-border);
    border-radius:4px;font-size:clamp(7px,2.4vw,11px);font-weight:bold;
    color:var(--text-main);position:relative;
  }
  .key.deco{
    color:var(--text-dim);font-size:clamp(6px,2vw,9px);
    border-bottom:3px solid #454c78;
  }
  .key .kanaTag{
    position:absolute;top:-13px;left:50%;transform:translate(-50%,0) scale(1);
    font-size:clamp(9px,2.6vw,12px);color:var(--accent-yellow);
    font-weight:bold;line-height:1;white-space:nowrap;
    text-shadow:0 0 6px rgba(255,225,75,.6);
    opacity:.55;
  }
  @keyframes kanaPop{
    0%{ transform:translate(-50%,5px) scale(.6); opacity:0; }
    55%{ transform:translate(-50%,-20px) scale(1.3); opacity:1; }
    100%{ transform:translate(-50%,-13px) scale(1); opacity:1; }
  }
  .key.next .kanaTag{
    animation:kanaPop .32s cubic-bezier(.25,1.5,.5,1);
    opacity:1;color:#fff8d8;
    text-shadow:0 0 10px var(--accent-yellow),0 0 14px var(--accent-yellow);
  }
  .key.wide{flex:1.6 1 0;max-width:64px;}
  .key.xwide{flex:2.2 1 0;max-width:90px;}
  .key.home::after{
    content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
    width:8px;height:2px;border-radius:2px;background:var(--text-dim);
  }
  .key.next{
    outline:2px solid var(--accent-yellow);
    box-shadow:0 0 10px var(--accent-yellow), 0 0 2px var(--accent-yellow) inset;
    transform:translateY(-2px) scale(1.06);
    z-index:2;
  }
  .key.space{max-width:220px;flex:2 1 0;}
  .fLpinky{border-bottom:3px solid var(--f-lpinky);}
  .fLring{border-bottom:3px solid var(--f-lring);}
  .fLmiddle{border-bottom:3px solid var(--f-lmiddle);}
  .fLindex{border-bottom:3px solid var(--f-lindex);}
  .fRindex{border-bottom:3px solid var(--f-rindex);}
  .fRmiddle{border-bottom:3px solid var(--f-rmiddle);}
  .fRring{border-bottom:3px solid var(--f-rring);}
  .fRpinky{border-bottom:3px solid var(--f-rpinky);}
  .fThumb{border-bottom:3px solid var(--f-thumb);}

  #hint{font-size:9px;color:var(--text-dim);text-align:center;padding-bottom:1px;}
</style>
</head>
<body>
<div id="app">

  <div id="hud">
    <div class="grp">
      <span class="level">Lv <span id="lvVal">1</span></span>
      <span class="score">SCORE <span id="scoreVal">0</span></span>
    </div>
    <div id="titleTag">JIS配列ブラインドタッチ</div>
    <div class="grp">
      <span class="combo">COMBO <span id="comboVal">0</span></span>
      <span class="lives" id="livesVal">♥♥♥</span>
    </div>
  </div>

  <div id="stageWrap">
    <canvas id="stage"></canvas>

    <div id="startOverlay" class="overlay">
      <h1>ブラウザで動く タイピングシューティングゲーム</h1>
      <p>降ってくる敵の下に表示されたローマ字を、キーボードのホームポジションを崩さずに正確に打ち込んで撃墜しよう。<br>
      画面下のキーボードは指ごとに色分けされていて、次に押すキーが黄色く光ります。ブラインドタッチの練習に最適です。</p>
      <div class="diffRow">
        <button class="btn primary" data-diff="easy">かんたん</button>
        <button class="btn primary" data-diff="normal">ふつう</button>
        <button class="btn mag primary" data-diff="hard">むずかしい</button>
      </div>
      <p id="startHintText"></p>
    </div>

    <div id="pauseOverlay" class="overlay hidden">
      <h1>PAUSE</h1>
      <button class="btn primary" id="resumeBtn">再開する</button>
      <button class="btn mag" id="quitBtn">タイトルへ戻る</button>
    </div>

    <div id="overOverlay" class="overlay hidden">
      <h1>GAME OVER</h1>
      <div class="big" id="finalScore">0</div>
      <p>最大コンボ: <span id="finalCombo">0</span> ／ 到達レベル: <span id="finalLevel">1</span></p>
      <div class="diffRow">
        <button class="btn primary" id="retryBtn">もう一度</button>
        <button class="btn mag" id="titleBtn">タイトルへ</button>
      </div>
    </div>
  </div>

  <div id="typeRow"><div id="typeBuffer">キーボードで入力してね</div></div>

  <div id="kbWrap">
    <div id="fingerLabel">&nbsp;</div>
    <div class="krow" id="row0"></div>
    <div class="krow" id="row1"></div>
    <div class="krow" id="row2"></div>
    <div class="krow" id="row3"></div>
    <div class="krow" id="row4"></div>
    <div id="hint">物理キーボードで入力 / 画面のキーもタップできます（スマホは補助表示）</div>
  </div>

</div>

<script>
(function(){
"use strict";

/* ============================================================
   単語データ（ひらがな＋ローマ字）
   ============================================================ */
const WORDS = {
  easy: [
    ["あさ","asa"],["いぬ","inu"],["うみ","umi"],["えき","eki"],["おか","oka"],
    ["かさ","kasa"],["きく","kiku"],["くも","kumo"],["けさ","kesa"],["こい","koi"],
    ["さる","saru"],["しか","sika"],["すし","susi"],["せみ","semi"],["そら","sora"],
    ["たこ","tako"],["つき","tuki"],["てら","tera"],["とり","tori"],["なつ","natu"],
    ["にく","niku"],["ねこ","neko"],["のり","nori"],["はし","hasi"],["ふね","fune"]
  ],
  normal: [
    ["がっこう","gakkou"],["せんせい","sensei"],["りんご","ringo"],["でんしゃ","densya"],
    ["きっぷ","kippu"],["びょういん","byouinn"],["きゅうり","kyuuri"],["しゃしん","syasinn"],
    ["ちゃいろ","tyairo"],["こうえん","kouen"],["おちゃ","otya"],["びっくり","bikkuri"],
    ["さんぽ","sanpo"],["けっこん","kekkon"],["としょかん","tosyokann"],["おんがく","ongaku"],
    ["たんじょうび","tanjoubi"],["きょうしつ","kyousitu"],["ゆうびん","yuubin"],["せいかつ","seikatu"]
  ],
  hard: [
    ["ありがとうございます","arigatougozaimasu"],["おはようございます","ohayougozaimasu"],
    ["よろしくおねがいします","yorosikuonegaisimasu"],["おつかれさまです","otukaresamadesu"],
    ["きょうはいいてんきです","kyouhaiitenkidesu"],["でんしゃがおくれました","densyagaokuremashita"],
    ["しゅくだいをわすれた","syukudaiwowasureta"],["にほんごのべんきょう","nihongonobenkyou"],
    ["たのしいまいにち","tanositimainiti"],["がんばってください","ganbatutekudasi"]
  ]
};

/* ============================================================
   キーボード配列（JIS配列：アルファベット部はUS配列と共通）
   ============================================================ */
const NUMBER_ROW = ["1","2","3","4","5","6","7","8","9","0","-","^","¥"];
const KEY_ROWS = [
  ["Q","W","E","R","T","Y","U","I","O","P","@","["],
  ["A","S","D","F","G","H","J","K","L",";",":","]"],
  ["Z","X","C","V","B","N","M",",",".","/","\\"],
];
const DECO_ROW1_PRE = {label:"Tab", finger:"fLpinky"};
const DECO_ROW1_POST = {label:"Enter", finger:"fRpinky"};
const DECO_ROW2_PRE = {label:"Caps", finger:"fLpinky"};
const DECO_ROW2_POST = {label:"Enter", finger:"fRpinky"};
const DECO_ROW3_PRE = {label:"Shift", finger:"fLpinky"};
const DECO_ROW3_POST = {label:"Shift", finger:"fRpinky"};
const DECO_NUM_POST = {label:"BS", finger:"fRpinky"};

const HOME_KEYS = new Set(["F","J"]);
const FINGER_MAP = {
  "1":"fLpinky",Q:"fLpinky",A:"fLpinky",Z:"fLpinky",
  "2":"fLring",W:"fLring",S:"fLring",X:"fLring",
  "3":"fLmiddle",E:"fLmiddle",D:"fLmiddle",C:"fLmiddle",
  "4":"fLindex","5":"fLindex",R:"fLindex",F:"fLindex",V:"fLindex",T:"fLindex",G:"fLindex",B:"fLindex",
  "6":"fRindex","7":"fRindex",Y:"fRindex",H:"fRindex",N:"fRindex",U:"fRindex",J:"fRindex",M:"fRindex",
  "8":"fRmiddle",I:"fRmiddle",K:"fRmiddle",",":"fRmiddle",
  "9":"fRring",O:"fRring",L:"fRring",".":"fRring",
  "0":"fRpinky",P:"fRpinky",";":"fRpinky","/":"fRpinky",
  "-":"fRpinky","^":"fRpinky","¥":"fRpinky","@":"fRpinky","[":"fRpinky",":":"fRpinky","]":"fRpinky","\\":"fRpinky",
};
const FINGER_NAME = {
  fLpinky:"左手 小指", fLring:"左手 薬指", fLmiddle:"左手 中指", fLindex:"左手 人差し指",
  fRindex:"右手 人差し指", fRmiddle:"右手 中指", fRring:"右手 薬指", fRpinky:"右手 小指",
  fThumb:"親指"
};

const kbEl = {
  row0:document.getElementById("row0"),
  row1:document.getElementById("row1"),
  row2:document.getElementById("row2"),
  row3:document.getElementById("row3"),
  row4:document.getElementById("row4"),
};
const keyElByChar = {};

function makeKeyDiv(label, fingerClass, opts){
  opts = opts||{};
  const div = document.createElement("div");
  const cls = ["key"];
  if(fingerClass) cls.push(fingerClass);
  if(opts.deco) cls.push("deco");
  if(opts.home) cls.push("home");
  if(opts.wide) cls.push("wide");
  if(opts.xwide) cls.push("xwide");
  div.className = cls.join(" ");
  if(opts.kana){
    const tag = document.createElement("span");
    tag.className = "kanaTag";
    tag.textContent = opts.kana;
    div.appendChild(tag);
  }
  const labelSpan = document.createElement("span");
  labelSpan.textContent = label;
  div.appendChild(labelSpan);
  if(!opts.deco){
    div.dataset.key = label;
    div.addEventListener("pointerdown",(e)=>{ e.preventDefault(); handleChar(label.toLowerCase()); });
    keyElByChar[label] = div;
  }
  return div;
}

const VOWEL_KANA = {A:"あ",I:"い",U:"う",E:"え",O:"お",N:"ん"};

// ローマ字→ひらがな変換マッピング
const ROMAJI_KANA_MAP = {
  // 単母音
  'a':'あ', 'i':'い', 'u':'う', 'e':'え', 'o':'お',
  // か行
  'ka':'か', 'ki':'き', 'ku':'く', 'ke':'け', 'ko':'こ',
  // さ行
  'sa':'さ', 'si':'し', 'su':'す', 'se':'せ', 'so':'そ',
  // た行
  'ta':'た', 'ti':'ち', 'tu':'つ', 'te':'て', 'to':'と',
  // な行
  'na':'な', 'ni':'に', 'nu':'ぬ', 'ne':'ね', 'no':'の',
  // は行
  'ha':'は', 'hi':'ひ', 'fu':'ふ', 'he':'へ', 'ho':'ほ'
};

function buildKeyboard(){
  // 数字段
  NUMBER_ROW.forEach(k=>kbEl.row0.appendChild(makeKeyDiv(k, FINGER_MAP[k])));
  kbEl.row0.appendChild(makeKeyDiv(DECO_NUM_POST.label, DECO_NUM_POST.finger, {deco:true,wide:true}));

  // 上段
  kbEl.row1.appendChild(makeKeyDiv(DECO_ROW1_PRE.label, DECO_ROW1_PRE.finger, {deco:true,wide:true}));
  KEY_ROWS[0].forEach(k=>kbEl.row1.appendChild(makeKeyDiv(k, FINGER_MAP[k], {kana:VOWEL_KANA[k]})));

  // ホーム段
  kbEl.row2.appendChild(makeKeyDiv(DECO_ROW2_PRE.label, DECO_ROW2_PRE.finger, {deco:true,wide:true}));
  KEY_ROWS[1].forEach(k=>kbEl.row2.appendChild(makeKeyDiv(k, FINGER_MAP[k], {home:HOME_KEYS.has(k), kana:VOWEL_KANA[k]})));
  kbEl.row2.appendChild(makeKeyDiv(DECO_ROW2_POST.label, DECO_ROW2_POST.finger, {deco:true,wide:true}));

  // 下段
  kbEl.row3.appendChild(makeKeyDiv(DECO_ROW3_PRE.label, DECO_ROW3_PRE.finger, {deco:true,xwide:true}));
  KEY_ROWS[2].forEach(k=>kbEl.row3.appendChild(makeKeyDiv(k, FINGER_MAP[k], {kana:VOWEL_KANA[k]})));
  kbEl.row3.appendChild(makeKeyDiv(DECO_ROW3_POST.label, DECO_ROW3_POST.finger, {deco:true,xwide:true}));

  // スペース段
  kbEl.row4.appendChild(makeKeyDiv("無変換", "fThumb", {deco:true,wide:true}));
  const spaceDiv = document.createElement("div");
  spaceDiv.className = "key space fThumb";
  spaceDiv.textContent = "SPACE";
  spaceDiv.dataset.key = " ";
  spaceDiv.addEventListener("pointerdown",(e)=>{ e.preventDefault(); handleChar(" "); });
  kbEl.row4.appendChild(spaceDiv);
  keyElByChar[" "] = spaceDiv;
  kbEl.row4.appendChild(makeKeyDiv("変換", "fThumb", {deco:true,wide:true}));
  kbEl.row4.appendChild(makeKeyDiv("かな", "fThumb", {deco:true,wide:true}));
}
buildKeyboard();

function highlightNextKey(ch){
  Object.values(keyElByChar).forEach(el=>el.classList.remove("next"));
  const fLabel = document.getElementById("fingerLabel");
  if(!ch){ fLabel.innerHTML="&nbsp;"; return; }
  const upper = ch.toUpperCase();
  const el = keyElByChar[upper === " " ? " " : upper];
  if(el){
    void el.offsetWidth; // force reflow so the emerge animation restarts every time
    el.classList.add("next");
    const fname = FINGER_MAP[upper] ? FINGER_NAME[FINGER_MAP[upper]] : "親指";
    fLabel.innerHTML = "次のキー: <b>"+upper+"</b> ("+fname+")";
  }
}

/* ============================================================
   オーディオ（Web Audio API 合成のみ、共有インスタンス）
   ============================================================ */
let actx = null;
function ensureAudio(){ if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } return actx; }

function playTone(freq, dur, type, vol, glideTo){
  const ctx = ensureAudio();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || "square";
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, ctx.currentTime+dur);
  gain.gain.setValueAtTime(vol||0.15, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime+dur);
}
function playLaser(){ playTone(900,0.08,"square",0.10,1800); }
function playMiss(){ playTone(160,0.14,"sawtooth",0.12,90); }
function playExplosion(){
  const ctx = ensureAudio();
  const bufSize = ctx.sampleRate*0.28;
  const buf = ctx.createBuffer(1,bufSize,ctx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++){ data[i] = (Math.random()*2-1) * (1-i/bufSize); }
  const noise = ctx.createBufferSource(); noise.buffer = buf;
  const gain = ctx.createGain(); gain.gain.setValueAtTime(0.28, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.28);
  const filt = ctx.createBiquadFilter(); filt.type="lowpass"; filt.frequency.setValueAtTime(1800,ctx.currentTime);
  noise.connect(filt); filt.connect(gain); gain.connect(ctx.destination);
  noise.start();
  playTone(120,0.2,"triangle",0.15,50);
}
function playLevelUp(){ playTone(600,0.1,"sine",0.14,1200); setTimeout(()=>playTone(900,0.14,"sine",0.14,1500),90); }
function playLifeLost(){ playTone(300,0.3,"sawtooth",0.16,60); }
function playGameOver(){ playTone(400,0.5,"sawtooth",0.18,80); }

/* ============================================================
   ゲーム状態
   ============================================================ */
const canvas = document.getElementById("stage");
const ctx2d = canvas.getContext("2d");
const stageWrap = document.getElementById("stageWrap");

let W=0,H=0,DPR=1;
function resizeCanvas(){
  const rect = stageWrap.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = Math.max(280, rect.width);
  H = Math.max(240, rect.height);
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+"px"; canvas.style.height = H+"px";
  ctx2d.setTransform(DPR,0,0,DPR,0,0);
}
resizeCanvas();
window.addEventListener("resize", ()=>{ requestAnimationFrame(resizeCanvas); setTimeout(resizeCanvas,300); });
window.addEventListener("orientationchange", ()=>{ setTimeout(resizeCanvas,300); setTimeout(resizeCanvas,900); });
if(window.visualViewport){ window.visualViewport.addEventListener("resize", ()=>{ requestAnimationFrame(resizeCanvas); }); }

let state = "title"; // title | playing | pause | over
let difficulty = "easy";
let enemies = [];
let particles = [];
let lasers = [];
let score=0, combo=0, maxCombo=0, lives=3, level=1;
let spawnTimer=0, spawnInterval=2200;
let targetEnemy = null;
let usedWords = [];
let lastTime=0;
let shake=0;
let enemyIdSeq=1;

const DIFF_CONF = {
  easy:   {pool:["easy"], baseSpeed:22, spawnBase:2400, spawnMin:1300},
  normal: {pool:["easy","normal"], baseSpeed:30, spawnBase:2000, spawnMin:1000},
  hard:   {pool:["normal","hard"], baseSpeed:38, spawnBase:1700, spawnMin:850},
};

function pickWord(){
  const conf = DIFF_CONF[difficulty];
  const poolName = conf.pool[Math.floor(Math.random()*conf.pool.length)];
  const list = WORDS[poolName];
  let idx = Math.floor(Math.random()*list.length);
  // avoid immediate repeats
  let tries=0;
  while(usedWords.includes(list[idx][1]) && tries<8){ idx = Math.floor(Math.random()*list.length); tries++; }
  usedWords.push(list[idx][1]);
  if(usedWords.length>6) usedWords.shift();
  return list[idx];
}

function getKeyCanvasX(ch){
  if(!ch) return W/2;
  const el = keyElByChar[ch.toUpperCase()];
  if(!el) return W/2;
  const kr = el.getBoundingClientRect();
  const cr = canvas.getBoundingClientRect();
  const x = (kr.left + kr.width/2) - cr.left;
  return Math.max(26, Math.min(W-26, x));
}

function spawnEnemy(){
  const [hira, romaji] = pickWord();
  const conf = DIFF_CONF[difficulty];
  const speed = conf.baseSpeed + level*2.2 + Math.random()*8;
  const x = getKeyCanvasX(romaji[0]);

  // 上部で他の敵と重なりそうなら今回はスポーンを見送る（次のタイマーで再試行）
  const tooClose = enemies.some(e => e.y < 70 && Math.abs(e.x - x) < 46);
  if(tooClose) return;

  const jitter = (Math.random()*26 - 13);
  enemies.push({
    id: enemyIdSeq++,
    hira, romaji,
    typed: 0,
    x, targetX: x, y: -30,
    speed,
    hue: 180 + Math.random()*140,
    wobble: Math.random()*Math.PI*2,
    xJitter: jitter,
  });
}

function resetGame(diff){
  difficulty = diff;
  enemies=[]; particles=[]; lasers=[]; usedWords=[];
  score=0; combo=0; maxCombo=0; lives=3; level=1;
  spawnTimer=0; spawnInterval = DIFF_CONF[diff].spawnBase;
  targetEnemy=null;
  typedBuffer="";
  updateHUD();
  updateTypeBuffer();
  highlightNextKey(null);
}

function updateHUD(){
  document.getElementById("scoreVal").textContent = score;
  document.getElementById("comboVal").textContent = combo;
  document.getElementById("lvVal").textContent = level;
  document.getElementById("livesVal").textContent = "♥".repeat(Math.max(lives,0)) + "♡".repeat(Math.max(3-lives,0));
}

let typedBuffer = "";
function updateTypeBuffer(){
  const el = document.getElementById("typeBuffer");
  if(targetEnemy){
    const full = targetEnemy.romaji;
    const done = full.slice(0, targetEnemy.typed).split("").join(" ");
    const rest = full.slice(targetEnemy.typed).split("").join(" ");
    el.innerHTML = '<span class="ok">'+done+'</span>'+(done&&rest?"  ":"")+rest;
    highlightNextKey(full[targetEnemy.typed]||null);
  } else {
    el.textContent = "つぎのローマ字を入力";
    highlightNextKey(null);
  }
}

/* ============================================================
   入力処理
   ============================================================ */
function handleChar(ch){
  if(state!=="playing") return;
  ch = ch.toLowerCase();

  if(!targetEnemy){
    // find nearest (lowest = closest to bottom, highest y) enemy whose romaji starts with ch
    let candidates = enemies.filter(e=>e.romaji[0]===ch);
    if(candidates.length===0){ missFeedback(); return; }
    candidates.sort((a,b)=>b.y-a.y);
    targetEnemy = candidates[0];
    targetEnemy.typed = 1;
    fireLaser(targetEnemy);
    playLaser();
    if(targetEnemy.typed>=targetEnemy.romaji.length){ destroyEnemy(targetEnemy); }
    updateTypeBuffer();
    return;
  }

  const expected = targetEnemy.romaji[targetEnemy.typed];
  if(ch===expected){
    targetEnemy.typed++;
    fireLaser(targetEnemy);
    playLaser();
    if(targetEnemy.typed>=targetEnemy.romaji.length){
      destroyEnemy(targetEnemy);
    }
    updateTypeBuffer();
  } else {
    missFeedback();
  }
}

function missFeedback(){
  playMiss();
  combo = 0;
  shake = 6;
  updateHUD();
}

function destroyEnemy(enemy){
  score += 10 * Math.max(1, Math.min(combo+1, 20)) + level*2;
  combo++;
  if(combo>maxCombo) maxCombo=combo;
  spawnExplosion(enemy.x, enemy.y, enemy.hue);
  playExplosion();
  enemies = enemies.filter(e=>e.id!==enemy.id);
  targetEnemy = null;
  updateHUD();
  updateTypeBuffer();
  maybeLevelUp();
}

function maybeLevelUp(){
  const nextLevelScore = level*150;
  if(score >= nextLevelScore){
    level++;
    spawnInterval = Math.max(DIFF_CONF[difficulty].spawnMin, spawnInterval*0.92);
    playLevelUp();
    updateHUD();
  }
}

function fireLaser(enemy){
  lasers.push({ x1: W/2, y1: H-46, x2: enemy.x, y2: enemy.y, life: 0.12 });
}

function spawnExplosion(x,y,hue){
  for(let i=0;i<18;i++){
    const ang = Math.random()*Math.PI*2;
    const spd = 60+Math.random()*140;
    particles.push({
      x,y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
      life:1, hue: hue + (Math.random()*40-20)
    });
  }
}

window.addEventListener("keydown",(e)=>{
  if(state!=="playing"){
    if(e.key==="Escape" && state==="pause"){ resumeGame(); }
    return;
  }
  if(e.key==="Escape"){ pauseGame(); return; }
  if(e.key.length===1 && /[a-zA-Z]/.test(e.key)){
    e.preventDefault();
    handleChar(e.key);
  } else if(e.key===" "){
    e.preventDefault();
  }
});

/* ============================================================
   ゲームループ
   ============================================================ */
function update(dt){
  spawnTimer += dt*1000;
  if(spawnTimer >= spawnInterval && enemies.length < 6+Math.min(level,6)){
    spawnTimer = 0;
    spawnEnemy();
  }

  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    e.y += e.speed*dt;
    e.wobble += dt*2;
    const rawTargetX = getKeyCanvasX(e.romaji[e.typed]);
    e.targetX = Math.max(26, Math.min(W-26, rawTargetX + e.xJitter));
    e.x += (e.targetX - e.x) * Math.min(1, dt*7);
    if(e.y > H-24){
      // reached bottom
      lives--;
      shake = 10;
      playLifeLost();
      if(targetEnemy && targetEnemy.id===e.id){ targetEnemy=null; updateTypeBuffer(); }
      enemies.splice(i,1);
      combo = 0;
      updateHUD();
      if(lives<=0){ gameOver(); return; }
    }
  }

  // 敵同士の重なり解消（タイル同士が近すぎる場合は左右に押し分ける）
  for(let i=0;i<enemies.length;i++){
    for(let j=i+1;j<enemies.length;j++){
      const a = enemies[i], b = enemies[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const minDX = 50, minDY = 34;
      if(Math.abs(dy) < minDY && Math.abs(dx) < minDX){
        const overlap = (minDX - Math.abs(dx)) * 0.5;
        const push = (dx>=0?1:-1) * overlap * dt*10;
        a.x = Math.max(26, Math.min(W-26, a.x - push));
        b.x = Math.max(26, Math.min(W-26, b.x + push));
      }
    }
  }

  for(let i=lasers.length-1;i>=0;i--){
    lasers[i].life -= dt;
    if(lasers[i].life<=0) lasers.splice(i,1);
  }

  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life -= dt*1.6;
    if(p.life<=0) particles.splice(i,1);
  }

  if(shake>0) shake = Math.max(0, shake-dt*40);
}

function draw(){
  ctx2d.clearRect(0,0,W,H);

  ctx2d.save();
  if(shake>0){
    ctx2d.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }

  // starfield
  ctx2d.fillStyle = "rgba(255,255,255,0.5)";
  for(let i=0;i<40;i++){
    const sx = (i*97 % W);
    const sy = (i*53 + (performance.now()*0.02)) % H;
    ctx2d.globalAlpha = 0.15 + (i%5)*0.08;
    ctx2d.fillRect(sx, sy, 1.4, 1.4);
  }
  ctx2d.globalAlpha = 1;

  // danger line
  ctx2d.strokeStyle = "rgba(255,90,90,0.35)";
  ctx2d.setLineDash([6,6]);
  ctx2d.beginPath(); ctx2d.moveTo(0,H-24); ctx2d.lineTo(W,H-24); ctx2d.stroke();
  ctx2d.setLineDash([]);

  // lasers
  lasers.forEach(l=>{
    ctx2d.strokeStyle = "rgba(75,227,255,"+(l.life/0.12)+")";
    ctx2d.lineWidth = 2.5;
    ctx2d.beginPath(); ctx2d.moveTo(l.x1,l.y1); ctx2d.lineTo(l.x2,l.y2); ctx2d.stroke();
  });

  // enemies
  enemies.forEach(e=>{
    const isTarget = targetEnemy && targetEnemy.id===e.id;
    const bob = Math.sin(e.wobble)*3;
    const cx = e.x, cy = e.y+bob;
    const curChar = (e.romaji[e.typed]||"").toUpperCase();
    const tileW = 52, tileH = 40, r = 9;

    ctx2d.save();
    ctx2d.translate(cx, cy);

    // keycap tile
    ctx2d.beginPath();
    ctx2d.moveTo(-tileW/2+r, -tileH/2);
    ctx2d.arcTo(tileW/2, -tileH/2, tileW/2, tileH/2, r);
    ctx2d.arcTo(tileW/2, tileH/2, -tileW/2, tileH/2, r);
    ctx2d.arcTo(-tileW/2, tileH/2, -tileW/2, -tileH/2, r);
    ctx2d.arcTo(-tileW/2, -tileH/2, tileW/2, -tileH/2, r);
    ctx2d.closePath();

    ctx2d.fillStyle = isTarget ? "#232a52" : "#171b34";
    if(isTarget){ ctx2d.shadowColor = "#ffe14b"; ctx2d.shadowBlur = 18; }
    ctx2d.fill();
    ctx2d.shadowBlur = 0;

    ctx2d.lineWidth = isTarget ? 2.4 : 1.6;
    ctx2d.strokeStyle = isTarget ? "#ffe14b" : `hsl(${e.hue},70%,55%)`;
    ctx2d.stroke();

    // bottom accent bar (matches on-screen keyboard key styling)
    ctx2d.fillStyle = `hsl(${e.hue},80%,55%)`;
    ctx2d.fillRect(-tileW/2+r, tileH/2-3, tileW-r*2, 3);

    // big single letter = next key to press
    ctx2d.fillStyle = isTarget ? "#fff8d8" : "#eaf2ff";
    ctx2d.font = "bold 22px monospace";
    ctx2d.textAlign = "center";
    ctx2d.textBaseline = "middle";
    ctx2d.fillText(curChar, 0, 1);
    ctx2d.textBaseline = "alphabetic";

    ctx2d.restore();

    // small hiragana hint above the tile
    ctx2d.font = "12px sans-serif";
    ctx2d.textAlign = "center";
    ctx2d.fillStyle = isTarget ? "rgba(255,225,75,0.9)" : "rgba(234,242,255,0.5)";
    ctx2d.fillText(e.hira, cx, cy - tileH/2 - 8);
  });

  // particles
  particles.forEach(p=>{
    ctx2d.globalAlpha = Math.max(0,p.life);
    ctx2d.fillStyle = `hsl(${p.hue},90%,60%)`;
    ctx2d.beginPath(); ctx2d.arc(p.x,p.y,3,0,Math.PI*2); ctx2d.fill();
  });
  ctx2d.globalAlpha = 1;

  // ship
  ctx2d.save();
  ctx2d.translate(W/2, H-40);
  ctx2d.beginPath();
  ctx2d.moveTo(0,-16); ctx2d.lineTo(16,14); ctx2d.lineTo(0,7); ctx2d.lineTo(-16,14);
  ctx2d.closePath();
  ctx2d.fillStyle = "#4be3ff";
  ctx2d.shadowColor = "#4be3ff"; ctx2d.shadowBlur = 10;
  ctx2d.fill();
  ctx2d.restore();

  ctx2d.restore();
}

function loop(ts){
  if(!lastTime) lastTime=ts;
  const dt = Math.min(0.05,(ts-lastTime)/1000);
  lastTime = ts;
  if(state==="playing"){
    update(dt);
    draw();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ============================================================
   画面遷移
   ============================================================ */
const startOverlay = document.getElementById("startOverlay");
const pauseOverlay = document.getElementById("pauseOverlay");
const overOverlay = document.getElementById("overOverlay");

document.querySelectorAll("[data-diff]").forEach(btn=>{
  btn.addEventListener("pointerdown",(e)=>{
    e.preventDefault();
    ensureAudio();
    if(actx.state==="suspended") actx.resume();
    startGame(btn.dataset.diff);
  });
});
document.getElementById("resumeBtn").addEventListener("pointerdown",(e)=>{e.preventDefault();resumeGame();});
document.getElementById("quitBtn").addEventListener("pointerdown",(e)=>{e.preventDefault();backToTitle();});
document.getElementById("retryBtn").addEventListener("pointerdown",(e)=>{e.preventDefault();startGame(difficulty);});
document.getElementById("titleBtn").addEventListener("pointerdown",(e)=>{e.preventDefault();backToTitle();});

function startGame(diff){
  resetGame(diff);
  startOverlay.classList.add("hidden");
  pauseOverlay.classList.add("hidden");
  overOverlay.classList.add("hidden");
  state = "playing";
  lastTime = 0;
}
function pauseGame(){
  if(state!=="playing") return;
  state="pause";
  pauseOverlay.classList.remove("hidden");
}
function resumeGame(){
  if(state!=="pause") return;
  pauseOverlay.classList.add("hidden");
  state="playing";
  lastTime=0;
}
function backToTitle(){
  state="title";
  pauseOverlay.classList.add("hidden");
  overOverlay.classList.add("hidden");
  startOverlay.classList.remove("hidden");
}
function gameOver(){
  state="over";
  playGameOver();
  document.getElementById("finalScore").textContent = score;
  document.getElementById("finalCombo").textContent = maxCombo;
  document.getElementById("finalLevel").textContent = level;
  overOverlay.classList.remove("hidden");
}

// prevent iOS bounce / pinch
document.addEventListener("touchmove",(e)=>{ e.preventDefault(); }, {passive:false});
document.addEventListener("gesturestart",(e)=>{ e.preventDefault(); });

})();
</script>
