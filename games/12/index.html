<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ブラインドタッチ練習 - 五十音</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Share+Tech+Mono&display=swap');

  :root {
    --primary: #1a1a2e;
    --neon: #e94560;
    --neon2: #00d4ff;
    --neon3: #39ff14;
    --gold: #ffd700;
    --text: #e8e8f0;
    --text-dim: #8888aa;
    --card-bg: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--primary);
    color: var(--text);
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(9,25,70,0.8) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(233,69,96,0.15) 0%, transparent 50%),
      repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,0.01) 40px, rgba(255,255,255,0.01) 41px),
      repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.01) 40px, rgba(255,255,255,0.01) 41px);
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 8px 12px;
    gap: 6px;
  }

  /* ===== HEADER ===== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .title-block h1 {
    font-size: clamp(1rem, 2.5vw, 1.5rem);
    font-weight: 900;
    letter-spacing: 0.12em;
    background: linear-gradient(135deg, var(--neon2), var(--neon));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }
  .title-block .sub {
    font-size: 0.58rem;
    color: var(--text-dim);
    letter-spacing: 0.2em;
  }
  .mode-buttons { display: flex; gap: 6px; }
  .btn-mode {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255,215,0,0.3);
    color: var(--gold);
    background: transparent;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-mode:hover, .btn-mode.active {
    background: rgba(255,215,0,0.12);
    border-color: var(--gold);
  }

  /* ===== STATS ===== */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    flex-shrink: 0;
  }
  .stat-card {
    background: var(--card-bg);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 5px 8px;
    text-align: center;
  }
  .stat-label { font-size: 0.55rem; color: var(--text-dim); letter-spacing: 0.1em; }
  .stat-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(1rem, 2.5vw, 1.4rem);
    font-weight: 700;
    color: var(--neon2);
    line-height: 1.2;
  }
  .stat-value.timer    { color: var(--gold); }
  .stat-value.score    { color: var(--neon3); }
  .stat-value.miss     { color: var(--neon); }
  .stat-value.accuracy { color: #ff9f43; }

  /* ===== MAIN ===== */
  .main-area {
    display: flex;
    gap: 10px;
    flex: 1;
    min-height: 0;
  }

  /* LEFT */
  .left-col {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 52%;
    min-width: 0;
  }

  .target-area {
    background: linear-gradient(135deg, rgba(15,52,96,0.6), rgba(22,33,62,0.8));
    border: 1px solid rgba(0,212,255,0.3);
    border-radius: 12px;
    padding: 10px 14px;
    text-align: center;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  .target-area::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(-45deg, transparent, transparent 8px, rgba(0,212,255,0.015) 8px, rgba(0,212,255,0.015) 9px);
    pointer-events: none;
  }
  .mode-badge { font-size: 0.58rem; letter-spacing: 0.15em; color: var(--neon2); opacity: 0.7; margin-bottom: 2px; }
  .target-char {
    font-size: clamp(3.5rem, 9vw, 6.5rem);
    font-weight: 900;
    line-height: 1;
    display: block;
    text-shadow: 0 0 30px rgba(0,212,255,0.5);
  }
  .target-char.correct-flash { animation: cFlash 0.28s ease; }
  .target-char.wrong-flash   { animation: wFlash 0.28s ease; }
  @keyframes cFlash {
    0%  { transform:scale(1); color:var(--text); }
    50% { transform:scale(1.18); color:var(--neon3); text-shadow:0 0 40px var(--neon3); }
    100%{ transform:scale(1); color:var(--text); }
  }
  @keyframes wFlash {
    0%,100%{ transform:translateX(0); }
    25%    { transform:translateX(-8px); }
    75%    { transform:translateX(8px); }
  }
  .romaji-hint {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(0.85rem, 2vw, 1.1rem);
    color: var(--text-dim);
    letter-spacing: 0.25em;
    margin-top: 4px;
  }

  .input-display {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 8px;
    padding: 8px 14px;
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(0.9rem, 2vw, 1.1rem);
    color: var(--neon2);
    text-align: center;
    letter-spacing: 0.3em;
    flex-shrink: 0;
  }
  .cursor-blink {
    display: inline-block;
    width: 2px; height: 1em;
    background: var(--neon2);
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  .feedback-msg {
    text-align: center;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    height: 18px;
    flex-shrink: 0;
  }
  .msg-correct { color: var(--neon3); }
  .msg-wrong   { color: var(--neon); }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .progress-bar-bg {
    flex: 1; height: 5px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--neon2), var(--neon));
    border-radius: 3px;
    transition: width 0.3s ease;
    box-shadow: 0 0 6px rgba(0,212,255,0.5);
  }
  .progress-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem; color: var(--text-dim); white-space: nowrap;
  }

  .btn-row { display: flex; gap: 8px; flex-shrink: 0; }
  .btn {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.8rem; font-weight: 500;
    letter-spacing: 0.08em;
    padding: 8px 0;
    border-radius: 7px; border: 1px solid;
    cursor: pointer; background: transparent;
    flex: 1; transition: all 0.15s;
  }
  .btn-start { border-color: var(--neon2); color: var(--neon2); box-shadow: 0 0 8px rgba(0,212,255,0.15); }
  .btn-start:hover { background: rgba(0,212,255,0.12); }
  .btn-reset { border-color: var(--text-dim); color: var(--text-dim); }
  .btn-reset:hover { border-color: var(--text); color: var(--text); }

  /* RIGHT */
  .right-col {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }

  .hiragana-table {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 3px;
    background: var(--card-bg);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    flex-shrink: 0;
  }
  .kana-cell {
    text-align: center;
    padding: 3px 1px;
    border-radius: 5px;
    font-size: clamp(0.65rem, 1.5vw, 0.9rem);
    color: var(--text-dim);
    transition: all 0.18s;
  }
  .kana-cell.completed { color: var(--neon3); background: rgba(57,255,20,0.08); }
  .kana-cell.current   {
    color: var(--neon2); background: rgba(0,212,255,0.14);
    font-weight: 700; animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100%{ box-shadow:0 0 6px rgba(0,212,255,0.3); }
    50%    { box-shadow:0 0 14px rgba(0,212,255,0.6); }
  }

  .keyboard-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .keyboard-label { font-size: 0.55rem; letter-spacing: 0.2em; color: var(--text-dim); margin-bottom: 5px; }
  .keyboard-rows  { display: flex; flex-direction: column; gap: 5px; align-items: center; }
  .key-row        { display: flex; gap: 4px; }
  .key {
    width: clamp(28px,4.2vw,42px);
    height: clamp(28px,4.2vw,42px);
    background: var(--card-bg);
    border: 0.5px solid var(--border);
    border-bottom: 2px solid rgba(255,255,255,0.05);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(0.6rem,1.3vw,0.8rem);
    color: var(--text-dim);
    transition: all 0.08s;
  }
  .key.pressed {
    background: rgba(0,212,255,0.2);
    border-color: var(--neon2); color: var(--neon2);
    transform: translateY(1px);
    box-shadow: 0 0 10px rgba(0,212,255,0.4);
  }
  .key.target-key {
    border-color: rgba(0,212,255,0.5); color: var(--text);
    box-shadow: 0 0 7px rgba(0,212,255,0.2);
  }
  .key.space-key { width: clamp(80px,14vw,140px); }

  /* ===== RESULT OVERLAY ===== */
  .result-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(10,10,20,0.88);
    z-index: 100;
    align-items: center; justify-content: center;
  }
  .result-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from{opacity:0;transform:scale(0.94)} to{opacity:1;transform:scale(1)} }
  .result-box {
    background: linear-gradient(135deg, rgba(15,52,96,0.95), rgba(22,33,62,0.98));
    border: 1px solid rgba(0,212,255,0.4);
    border-radius: 16px;
    padding: 28px 24px;
    width: min(400px,90vw);
    text-align: center;
  }
  .result-title {
    font-size: 1.4rem; font-weight: 900;
    letter-spacing: 0.2em; color: var(--gold);
    text-shadow: 0 0 20px rgba(255,215,0,0.4);
    margin-bottom: 18px;
  }
  .result-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 18px; }
  .result-item {
    background: rgba(255,255,255,0.04);
    border: 0.5px solid var(--border);
    border-radius: 10px; padding: 12px;
  }
  .result-item-label { font-size: 0.65rem; color: var(--text-dim); letter-spacing: 0.15em; margin-bottom: 4px; }
  .result-item-value { font-family: 'Share Tech Mono', monospace; font-size: 1.6rem; font-weight: 700; }
  .btn-again {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.9rem; font-weight: 500;
    width: 100%; padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--neon2); color: var(--neon2);
    background: transparent; cursor: pointer;
    transition: all 0.15s; letter-spacing: 0.1em;
  }
  .btn-again:hover { background: rgba(0,212,255,0.12); }

  #hidden-input {
    position: fixed; opacity: 0; pointer-events: none;
    top: -9999px; left: 0;
  }
</style>
</head>
<body>

<input id="hidden-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

<!-- HEADER -->
<div class="header">
  <div class="title-block">
    <h1>⌨ ブラインドタッチ</h1>
    <div class="sub">五十音練習 — TYPING MASTER</div>
  </div>
  <div class="mode-buttons">
    <button class="btn-mode active" onclick="setMode('aiueo')" id="mode-aiueo">あいうえお順</button>
    <button class="btn-mode" onclick="setMode('random')" id="mode-random">ランダム</button>
    <button class="btn-mode" onclick="setMode('hard')" id="mode-hard">難問（濁音）</button>
  </div>
</div>

<!-- STATS -->
<div class="stats-bar">
  <div class="stat-card"><div class="stat-label">⏱ タイム</div><div class="stat-value timer" id="timer">0.0</div></div>
  <div class="stat-card"><div class="stat-label">✓ 正解</div><div class="stat-value score" id="correct-count">0</div></div>
  <div class="stat-card"><div class="stat-label">✗ ミス</div><div class="stat-value miss" id="miss-count">0</div></div>
  <div class="stat-card"><div class="stat-label">精度</div><div class="stat-value accuracy" id="accuracy">-</div></div>
</div>

<!-- MAIN -->
<div class="main-area">
  <div class="left-col">
    <div class="target-area">
      <div class="mode-badge" id="mode-label">あいうえお順モード</div>
      <span class="target-char" id="target-char">あ</span>
      <div class="romaji-hint" id="romaji-hint">→ a</div>
    </div>
    <div class="input-display">
      <span id="input-text"></span><span class="cursor-blink"></span>
    </div>
    <div class="feedback-msg" id="feedback-msg"></div>
    <div class="progress-row">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="progress-text" id="progress-text">0 / 0</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-start" id="start-btn" onclick="startGame()">▶ スタート</button>
      <button class="btn btn-reset" onclick="resetGame()">↺ リセット</button>
    </div>
  </div>

  <div class="right-col">
    <div class="hiragana-table" id="kana-table"></div>
    <div class="keyboard-section">
      <div class="keyboard-label">KEYBOARD</div>
      <div class="keyboard-rows" id="keyboard"></div>
    </div>
  </div>
</div>

<!-- RESULT OVERLAY -->
<div class="result-overlay" id="result-overlay">
  <div class="result-box">
    <div class="result-title">🎉 クリア！</div>
    <div class="result-grid">
      <div class="result-item"><div class="result-item-label">⏱ タイム</div><div class="result-item-value" style="color:var(--gold)" id="r-time">-</div></div>
      <div class="result-item"><div class="result-item-label">速度 (字/秒)</div><div class="result-item-value" style="color:var(--neon2)" id="r-speed">-</div></div>
      <div class="result-item"><div class="result-item-label">正確度</div><div class="result-item-value" style="color:var(--neon3)" id="r-acc">-</div></div>
      <div class="result-item"><div class="result-item-label">ミス数</div><div class="result-item-value" style="color:var(--neon)" id="r-miss">-</div></div>
    </div>
    <button class="btn-again" onclick="resetGame()">もう一度チャレンジ ▶</button>
  </div>
</div>

<script>
const KANA_DATA = {
  aiueo: [
    {kana:'あ',roma:'a'},{kana:'い',roma:'i'},{kana:'う',roma:'u'},{kana:'え',roma:'e'},{kana:'お',roma:'o'},
    {kana:'か',roma:'ka'},{kana:'き',roma:'ki'},{kana:'く',roma:'ku'},{kana:'け',roma:'ke'},{kana:'こ',roma:'ko'},
    {kana:'さ',roma:'sa'},{kana:'し',roma:'si'},{kana:'す',roma:'su'},{kana:'せ',roma:'se'},{kana:'そ',roma:'so'},
    {kana:'た',roma:'ta'},{kana:'ち',roma:'ti'},{kana:'つ',roma:'tu'},{kana:'て',roma:'te'},{kana:'と',roma:'to'},
    {kana:'な',roma:'na'},{kana:'に',roma:'ni'},{kana:'ぬ',roma:'nu'},{kana:'ね',roma:'ne'},{kana:'の',roma:'no'},
    {kana:'は',roma:'ha'},{kana:'ひ',roma:'hi'},{kana:'ふ',roma:'fu'},{kana:'へ',roma:'he'},{kana:'ほ',roma:'ho'},
    {kana:'ま',roma:'ma'},{kana:'み',roma:'mi'},{kana:'む',roma:'mu'},{kana:'め',roma:'me'},{kana:'も',roma:'mo'},
    {kana:'や',roma:'ya'},{kana:'ゆ',roma:'yu'},{kana:'よ',roma:'yo'},
    {kana:'ら',roma:'ra'},{kana:'り',roma:'ri'},{kana:'る',roma:'ru'},{kana:'れ',roma:'re'},{kana:'ろ',roma:'ro'},
    {kana:'わ',roma:'wa'},{kana:'を',roma:'wo'},{kana:'ん',roma:'n'},
  ],
  hard: [
    {kana:'あ',roma:'a'},{kana:'い',roma:'i'},{kana:'う',roma:'u'},{kana:'え',roma:'e'},{kana:'お',roma:'o'},
    {kana:'か',roma:'ka'},{kana:'き',roma:'ki'},{kana:'く',roma:'ku'},{kana:'け',roma:'ke'},{kana:'こ',roma:'ko'},
    {kana:'が',roma:'ga'},{kana:'ぎ',roma:'gi'},{kana:'ぐ',roma:'gu'},{kana:'げ',roma:'ge'},{kana:'ご',roma:'go'},
    {kana:'さ',roma:'sa'},{kana:'し',roma:'si'},{kana:'す',roma:'su'},{kana:'せ',roma:'se'},{kana:'そ',roma:'so'},
    {kana:'ざ',roma:'za'},{kana:'じ',roma:'zi'},{kana:'ず',roma:'zu'},{kana:'ぜ',roma:'ze'},{kana:'ぞ',roma:'zo'},
    {kana:'た',roma:'ta'},{kana:'ち',roma:'ti'},{kana:'つ',roma:'tu'},{kana:'て',roma:'te'},{kana:'と',roma:'to'},
    {kana:'だ',roma:'da'},{kana:'で',roma:'de'},{kana:'ど',roma:'do'},
    {kana:'な',roma:'na'},{kana:'に',roma:'ni'},{kana:'ぬ',roma:'nu'},{kana:'ね',roma:'ne'},{kana:'の',roma:'no'},
    {kana:'は',roma:'ha'},{kana:'ひ',roma:'hi'},{kana:'ふ',roma:'fu'},{kana:'へ',roma:'he'},{kana:'ほ',roma:'ho'},
    {kana:'ば',roma:'ba'},{kana:'び',roma:'bi'},{kana:'ぶ',roma:'bu'},{kana:'べ',roma:'be'},{kana:'ぼ',roma:'bo'},
    {kana:'ぱ',roma:'pa'},{kana:'ぴ',roma:'pi'},{kana:'ぷ',roma:'pu'},{kana:'ぺ',roma:'pe'},{kana:'ぽ',roma:'po'},
    {kana:'ま',roma:'ma'},{kana:'み',roma:'mi'},{kana:'む',roma:'mu'},{kana:'め',roma:'me'},{kana:'も',roma:'mo'},
    {kana:'や',roma:'ya'},{kana:'ゆ',roma:'yu'},{kana:'よ',roma:'yo'},
    {kana:'ら',roma:'ra'},{kana:'り',roma:'ri'},{kana:'る',roma:'ru'},{kana:'れ',roma:'re'},{kana:'ろ',roma:'ro'},
    {kana:'わ',roma:'wa'},{kana:'を',roma:'wo'},{kana:'ん',roma:'n'},
  ]
};

const KEYBOARD_LAYOUT = [
  ['q','w','e','r','t','y','u','i','o','p'],
  ['a','s','d','f','g','h','j','k','l'],
  ['z','x','c','v','b','n','m']
];

let mode='aiueo', kanaList=[], currentIdx=0, inputBuf='';
let correctCount=0, missCount=0, started=false, finished=false;
let startTime=null, timerInterval=null, elapsed=0;

/* Audio */
let audioCtx=null;
function getAudio(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function playBeep(freq,dur,type='sine',vol=0.15){
  try{
    const ctx=getAudio(),osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type=type; osc.frequency.setValueAtTime(freq,ctx.currentTime);
    gain.gain.setValueAtTime(vol,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime+dur);
  }catch(e){}
}
function playCorrect(){ playBeep(880,0.08,'triangle',0.12); setTimeout(()=>playBeep(1320,0.12,'triangle',0.08),60); }
function playMiss()   { playBeep(180,0.15,'sawtooth',0.1); }
function playStart()  { [440,554,659,880].forEach((f,i)=>setTimeout(()=>playBeep(f,0.15,'triangle',0.1),i*80)); }
function playFinish() { [523,659,784,1047,880,784,1047].forEach((f,i)=>setTimeout(()=>playBeep(f,0.2,'triangle',0.12),i*100)); }

function speakKana(text){
  if(!window.speechSynthesis) return;
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang='ja-JP'; utt.rate=0.9; utt.pitch=1.1; utt.volume=0.85;
  window.speechSynthesis.cancel(); window.speechSynthesis.speak(utt);
}

function setMode(m){
  mode=m;
  document.querySelectorAll('.btn-mode').forEach(b=>b.classList.remove('active'));
  document.getElementById('mode-'+m).classList.add('active');
  const labels={aiueo:'あいうえお順モード',random:'ランダムモード',hard:'難問モード（濁音含む）'};
  document.getElementById('mode-label').textContent=labels[m];
  resetGame();
}

function buildKanaTable(){
  const tbl=document.getElementById('kana-table'); tbl.innerHTML='';
  kanaList.forEach((item,i)=>{
    const cell=document.createElement('div');
    cell.className='kana-cell'; cell.id='kana-'+i; cell.textContent=item.kana;
    tbl.appendChild(cell);
  });
}

function buildKeyboard(){
  const kb=document.getElementById('keyboard'); kb.innerHTML='';
  KEYBOARD_LAYOUT.forEach(row=>{
    const rowEl=document.createElement('div'); rowEl.className='key-row';
    row.forEach(k=>{ const el=document.createElement('div'); el.className='key'; el.id='key-'+k; el.textContent=k; rowEl.appendChild(el); });
    if(row===KEYBOARD_LAYOUT[2]){
      const sp=document.createElement('div'); sp.className='key space-key'; sp.id='key-space'; sp.textContent='space'; rowEl.appendChild(sp);
    }
    kb.appendChild(rowEl);
  });
}

function highlightTargetKeys(roma){
  document.querySelectorAll('.key').forEach(k=>k.classList.remove('target-key'));
  [...roma].forEach(ch=>{ const el=document.getElementById('key-'+ch.toLowerCase()); if(el) el.classList.add('target-key'); });
}
function flashKey(ch){
  const el=document.getElementById('key-'+ch.toLowerCase()); if(!el) return;
  el.classList.add('pressed'); setTimeout(()=>el.classList.remove('pressed'),120);
}

function updateKanaTable(){
  kanaList.forEach((_,i)=>{
    const cell=document.getElementById('kana-'+i); if(!cell) return;
    cell.className='kana-cell';
    if(i<currentIdx) cell.classList.add('completed');
    else if(i===currentIdx) cell.classList.add('current');
  });
}

function updateStats(){
  document.getElementById('correct-count').textContent=correctCount;
  document.getElementById('miss-count').textContent=missCount;
  const total=correctCount+missCount;
  document.getElementById('accuracy').textContent=total>0?Math.round(correctCount/total*100)+'%':'-';
  const pct=kanaList.length>0?(currentIdx/kanaList.length)*100:0;
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('progress-text').textContent=currentIdx+' / '+kanaList.length;
}

function showCurrent(){
  if(currentIdx>=kanaList.length){ finishGame(); return; }
  const item=kanaList[currentIdx];
  document.getElementById('target-char').textContent=item.kana;
  document.getElementById('romaji-hint').textContent='→ '+item.roma;
  highlightTargetKeys(item.roma);
  updateKanaTable();
  inputBuf=''; document.getElementById('input-text').textContent='';
  speakKana(item.kana);
}

function startGame(){
  if(started&&!finished) return;
  resetGame(true);
  started=true; finished=false;
  document.getElementById('result-overlay').classList.remove('show');
  document.getElementById('start-btn').textContent='▶ 進行中';
  startTime=Date.now();
  timerInterval=setInterval(()=>{ elapsed=(Date.now()-startTime)/1000; document.getElementById('timer').textContent=elapsed.toFixed(1); },100);
  playStart(); showCurrent();
  document.getElementById('hidden-input').focus();
}

function resetGame(keepState){
  clearInterval(timerInterval);
  started=false; finished=false;
  currentIdx=0; correctCount=0; missCount=0; inputBuf=''; elapsed=0;
  document.getElementById('timer').textContent='0.0';
  document.getElementById('input-text').textContent='';
  document.getElementById('feedback-msg').textContent='';
  document.getElementById('feedback-msg').className='feedback-msg';
  document.getElementById('result-overlay').classList.remove('show');
  document.getElementById('start-btn').textContent='▶ スタート';
  document.getElementById('progress-fill').style.width='0%';
  document.getElementById('progress-text').textContent='0 / 0';
  document.getElementById('correct-count').textContent='0';
  document.getElementById('miss-count').textContent='0';
  document.getElementById('accuracy').textContent='-';
  kanaList=mode==='random'?[...KANA_DATA.aiueo].sort(()=>Math.random()-0.5):[...(KANA_DATA[mode]||KANA_DATA.aiueo)];
  buildKanaTable(); buildKeyboard();
  document.querySelectorAll('.key').forEach(k=>k.classList.remove('target-key'));
  const first=kanaList[0];
  document.getElementById('target-char').textContent=first?first.kana:'？';
  document.getElementById('romaji-hint').textContent=first?'→ '+first.roma:'';
}

function finishGame(){
  clearInterval(timerInterval); finished=true; started=false;
  const total=correctCount+missCount, acc=total>0?Math.round(correctCount/total*100):0;
  document.getElementById('r-time').textContent=elapsed.toFixed(1)+'s';
  document.getElementById('r-speed').textContent=elapsed>0?(correctCount/elapsed).toFixed(2):'0';
  document.getElementById('r-acc').textContent=acc+'%';
  document.getElementById('r-miss').textContent=missCount;
  document.getElementById('result-overlay').classList.add('show');
  document.getElementById('start-btn').textContent='▶ スタート';
  playFinish();
  window.speechSynthesis&&window.speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance('クリア！おめでとうございます'),{lang:'ja-JP'}));
}

function showFeedback(msg,type){
  const el=document.getElementById('feedback-msg');
  el.textContent=msg; el.className='feedback-msg '+(type==='ok'?'msg-correct':'msg-wrong');
  setTimeout(()=>{ el.textContent=''; el.className='feedback-msg'; },600);
}

function handleInput(ch){
  if(!started||finished) return;
  const item=kanaList[currentIdx]; if(!item) return;
  const target=item.roma;
  inputBuf+=ch; document.getElementById('input-text').textContent=inputBuf;
  flashKey(ch);
  if(target.startsWith(inputBuf)){
    if(inputBuf===target){
      correctCount++;
      const charEl=document.getElementById('target-char');
      charEl.classList.remove('correct-flash','wrong-flash'); void charEl.offsetWidth; charEl.classList.add('correct-flash');
      showFeedback('◎ 正解！','ok'); playCorrect();
      const kanaCell=document.getElementById('kana-'+currentIdx);
      if(kanaCell){ kanaCell.classList.remove('current'); kanaCell.classList.add('completed'); }
      currentIdx++; updateStats();
      setTimeout(()=>showCurrent(),150);
    }
  } else {
    missCount++; inputBuf=''; document.getElementById('input-text').textContent='';
    const charEl=document.getElementById('target-char');
    charEl.classList.remove('correct-flash','wrong-flash'); void charEl.offsetWidth; charEl.classList.add('wrong-flash');
    showFeedback('✗ ミス… 「'+target+'」','wrong'); playMiss(); updateStats();
  }
}

document.addEventListener('keydown', e=>{
  if(!started){ if(e.key==='Enter'){ startGame(); return; } return; }
  if(e.key.length===1&&/[a-zA-Z]/.test(e.key)){ e.preventDefault(); handleInput(e.key.toLowerCase()); }
});

document.getElementById('hidden-input').addEventListener('input', e=>{
  const val=e.target.value;
  if(val.length>0){ const ch=val[val.length-1]; if(/[a-zA-Z]/.test(ch)) handleInput(ch.toLowerCase()); e.target.value=''; }
});

document.addEventListener('click', ()=>{ if(started&&!finished) document.getElementById('hidden-input').focus(); });

resetGame();
</script>
</body>
</html>
