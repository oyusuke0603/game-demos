<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リフティング チャレンジ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap');
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background:#0a1a0a;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
    font-family:'M PLUS Rounded 1c',sans-serif;
  }
  #wrap{
    position:relative; width:420px; height:640px;
    margin:0 auto; overflow:hidden; border-radius:16px;
    box-shadow:0 0 60px rgba(0,200,60,0.3);
  }
  #wrap canvas{ position:absolute; top:0; left:0; display:block; }
  #bgCanvas{ z-index:1; }
  #gameCanvas{ z-index:2; cursor:pointer; touch-action:none; }

  #hud{
    position:absolute; top:0; left:0; right:0; z-index:5;
    display:grid; grid-template-columns:1fr 1fr 1fr;
    padding:12px 16px 0;
    background:linear-gradient(to bottom,rgba(0,0,0,0.65),transparent);
    pointer-events:none;
  }
  .hi{ font-size:10px; letter-spacing:1px; color:#88ffaa; font-weight:700; text-transform:uppercase; }
  .hi:nth-child(2){ text-align:center; }
  .hi:nth-child(3){ text-align:right; }
  .hv{ font-size:28px; font-weight:900; display:block; color:#fff; line-height:1.1; }

  #overlay{
    position:absolute; inset:0; z-index:10;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:rgba(0,10,0,0.9); backdrop-filter:blur(4px);
    border-radius:16px;
  }
  #overlay h1{
    font-size:46px; font-weight:900; line-height:1.15;
    text-align:center; width:100%;
    background:linear-gradient(135deg,#44ff88,#00dd44,#ffdd00);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 18px rgba(0,220,80,0.9));
    margin-bottom:8px;
  }
  .sub{ font-size:12px; letter-spacing:3px; color:#44ff88; margin-bottom:24px; text-align:center; }
  .big-score{ font-size:80px; color:#fff; margin-bottom:2px; text-align:center; font-weight:900; line-height:1; }
  .score-lbl{ font-size:13px; letter-spacing:2px; color:#88ffaa; margin-bottom:4px; opacity:.8; text-align:center; }
  .best-lbl{ font-size:15px; color:#ffdd00; margin-bottom:28px; text-align:center; font-weight:700; }
  .btn{
    padding:14px 52px; font-family:'M PLUS Rounded 1c',sans-serif;
    font-size:18px; font-weight:900; letter-spacing:2px; color:#fff;
    background:linear-gradient(135deg,#00cc44,#009933);
    border:none; cursor:pointer; border-radius:50px;
    box-shadow:0 4px 24px rgba(0,200,60,0.6);
    transition:transform .15s;
  }
  .btn:hover{ transform:scale(1.07); }
  #hint{ margin-top:12px; font-size:12px; color:rgba(150,255,180,.45); text-align:center; }
  #popup{
    position:absolute; top:30%; left:50%; transform:translate(-50%,-50%);
    z-index:8; font-size:32px; font-weight:900;
    pointer-events:none; opacity:0; transition:opacity .25s;
    text-align:center; white-space:nowrap; text-shadow:0 0 20px currentColor;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="bgCanvas"></canvas>
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div class="hi">回数<span class="hv" id="countEl">0</span></div>
    <div class="hi">コンボ<span class="hv" id="comboEl">0</span></div>
    <div class="hi">ベスト<span class="hv" id="bestEl">0</span></div>
  </div>
  <div id="popup"></div>
  <div id="overlay">
    <h1>⚽<br>リフティング<br>チャレンジ</h1>
    <div class="sub">◈ LIFTING GAME ◈</div>
    <button class="btn" id="startBtn">スタート！</button>
    <div id="hint">ボールに直接タッチしてキック！</div>
  </div>
</div>

<script>
const W=420, H=640;
const bgCvs=document.getElementById('bgCanvas');
const bgCtx=bgCvs.getContext('2d');
const cvs=document.getElementById('gameCanvas');
const ctx=cvs.getContext('2d');
bgCvs.width=cvs.width=W;
bgCvs.height=cvs.height=H;

// ===== AUDIO =====
let _ac=null;
function getAC(){ if(!_ac)_ac=new AudioContext(); if(_ac.state==='suspended')_ac.resume(); return _ac; }
function playKick(){
  try{
    const ac=getAC(), o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.connect(g); g.connect(ac.destination);
    const t=ac.currentTime;
    o.frequency.setValueAtTime(400,t);
    o.frequency.exponentialRampToValueAtTime(120,t+0.15);
    g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
    o.start(t); o.stop(t+0.18);
  }catch(e){}
}
function playMiss(){
  try{
    const ac=getAC(), o=ac.createOscillator(), g=ac.createGain();
    o.type='sawtooth'; o.connect(g); g.connect(ac.destination);
    const t=ac.currentTime;
    o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(50,t+0.3);
    g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    o.start(t); o.stop(t+0.3);
  }catch(e){}
}
function playComboSound(lv){
  try{
    const ac=getAC();
    const freqs=[[523,659],[659,784],[784,1047],[880,1320]];
    const pair=freqs[Math.min(lv,3)];
    pair.forEach((f,i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.connect(g); g.connect(ac.destination);
      const t=ac.currentTime+i*0.09;
      o.frequency.setValueAtTime(f,t);
      g.gain.setValueAtTime(0.14,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
      o.start(t); o.stop(t+0.22);
    });
  }catch(e){}
}

// ===== BG =====
function drawBg(){
  bgCtx.clearRect(0,0,W,H);
  const sky=bgCtx.createLinearGradient(0,0,0,H*0.5);
  sky.addColorStop(0,'#1a3a6a'); sky.addColorStop(1,'#2a5a9a');
  bgCtx.fillStyle=sky; bgCtx.fillRect(0,0,W,H*0.5);
  const grass=bgCtx.createLinearGradient(0,H*0.5,0,H);
  grass.addColorStop(0,'#1a7a1a'); grass.addColorStop(1,'#0d5a0d');
  bgCtx.fillStyle=grass; bgCtx.fillRect(0,H*0.5,W,H*0.5);
  for(let i=0;i<5;i++){
    bgCtx.fillStyle=i%2===0?'rgba(0,0,0,0.05)':'rgba(255,255,255,0.03)';
    bgCtx.fillRect(0,H*0.5+i*(H*0.1),W,H*0.1);
  }
  bgCtx.strokeStyle='rgba(255,255,255,0.2)'; bgCtx.lineWidth=2;
  bgCtx.beginPath(); bgCtx.moveTo(0,H*0.5); bgCtx.lineTo(W,H*0.5); bgCtx.stroke();
  for(const lx of [30,W-30]){
    bgCtx.fillStyle='#555';
    bgCtx.fillRect(lx-3,20,6,H*0.35);
    const spot=bgCtx.createRadialGradient(lx,24,0,lx,24,90);
    spot.addColorStop(0,'rgba(255,255,200,0.15)'); spot.addColorStop(1,'rgba(0,0,0,0)');
    bgCtx.fillStyle=spot; bgCtx.fillRect(lx-90,0,180,200);
    bgCtx.fillStyle='rgba(255,255,180,0.8)';
    bgCtx.beginPath(); bgCtx.arc(lx,24,7,0,Math.PI*2); bgCtx.fill();
  }
  bgCtx.strokeStyle='rgba(255,255,255,0.1)'; bgCtx.lineWidth=2;
  bgCtx.beginPath(); bgCtx.arc(W/2,H*0.75,70,0,Math.PI*2); bgCtx.stroke();
}

// ===== CONSTANTS =====
const GRAVITY  = 0.25;
const BALL_R   = 26;          // 少し大きめにして当てやすく
const GROUND_Y = H - 55;
const HIT_R    = BALL_R + 20; // タッチ判定半径（指分の余裕）

// ===== STATE =====
let state='menu';
let count=0, best=0, combo=0, missCount=0;
const MAX_MISS=3;

// ===== BALL =====
let ball={ x:W/2, y:GROUND_Y-BALL_R, vx:0, vy:0, rot:0, spin:0 };

// ===== PARTICLES =====
let particles=[];
function burst(x,y,col,n=12){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=Math.random()*5+2;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,dec:0.03,r:Math.random()*5+2,col});
  }
}
function starBurst(x,y){
  const cols=['#ffdd00','#ff8800','#fff','#44ff88','#ff4488'];
  for(let i=0;i<30;i++){
    const a=(Math.PI*2/30)*i, sp=Math.random()*9+3;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,dec:0.02,r:Math.random()*6+2,col:cols[i%5]});
  }
}

// ===== HUD =====
function hud(){
  document.getElementById('countEl').textContent=count;
  document.getElementById('comboEl').textContent=combo;
  document.getElementById('bestEl').textContent=best;
}

// ===== POPUP =====
let popupTimer=0;
function showPopup(txt,col){
  const el=document.getElementById('popup');
  el.innerHTML=txt; el.style.color=col; el.style.opacity='1';
  popupTimer=80;
}

// ===== INIT =====
function init(){
  count=0; combo=0; missCount=0;
  ball.x=W/2; ball.y=GROUND_Y-BALL_R;
  ball.vx=0; ball.vy=-10;
  ball.rot=0; ball.spin=0.04;
  particles=[];
  hud();
}

// ===== OVERLAY =====
const overlay=document.getElementById('overlay');
function showOverlay(title,sc,btnTxt){
  const sc_html=sc!==null?`
    <div class="big-score">${sc}</div>
    <div class="score-lbl">リフティング回数</div>
    <div class="best-lbl">🏆 ベスト：${best} 回</div>`:'';
  overlay.innerHTML=`
    <h1>${title}</h1><div class="sub">◈ LIFTING GAME ◈</div>
    ${sc_html}
    <button class="btn" id="startBtn">${btnTxt}</button>
    <div id="hint">ボールに直接タッチしてキック！</div>`;
  document.getElementById('startBtn').onclick=startGame;
  overlay.style.display='flex';
}
document.getElementById('startBtn').onclick=startGame;
function startGame(){ overlay.style.display='none'; init(); state='playing'; }

// ===== DRAW BALL =====
function drawBall(){
  const R=BALL_R;
  ctx.save();
  ctx.translate(ball.x, ball.y);

  // 地面の影
  const sh=Math.max(0.1, 1-(ball.y/GROUND_Y)*0.6);
  ctx.fillStyle=`rgba(0,0,0,${sh*0.3})`;
  ctx.beginPath(); ctx.ellipse(0,R+6,R*0.85,5,0,0,Math.PI*2); ctx.fill();

  ctx.rotate(ball.rot);

  // ボール本体グラデ
  const g=ctx.createRadialGradient(-R*0.3,-R*0.35,R*0.05,0,0,R);
  g.addColorStop(0,'#fff'); g.addColorStop(0.4,'#f0f0f0');
  g.addColorStop(0.8,'#ccc'); g.addColorStop(1,'#aaa');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fill();

  // 五角形パネル
  function penta(cx,cy,r,rot){
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a=rot+(Math.PI*2/5)*i-Math.PI/2;
      i===0?ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a))
           :ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
    }
    ctx.closePath();
  }
  const PR=R*0.28, GAP=R*0.6;
  ctx.fillStyle='#111'; ctx.strokeStyle='#222'; ctx.lineWidth=0.8;
  penta(0,0,PR,0); ctx.fill(); ctx.stroke();
  for(let i=0;i<5;i++){
    const a=(Math.PI*2/5)*i-Math.PI/2;
    penta(GAP*Math.cos(a),GAP*Math.sin(a),PR,a+Math.PI/5);
    ctx.fill(); ctx.stroke();
  }
  // 縫い目
  ctx.strokeStyle='rgba(50,50,50,0.4)'; ctx.lineWidth=0.8;
  for(let i=0;i<5;i++){
    const a=(Math.PI*2/5)*i-Math.PI/2;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(GAP*Math.cos(a),GAP*Math.sin(a)); ctx.stroke();
  }
  // 輪郭
  ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.stroke();
  // ハイライト
  const hl=ctx.createRadialGradient(-R*0.3,-R*0.36,0,-R*0.15,-R*0.2,R*0.5);
  hl.addColorStop(0,'rgba(255,255,255,0.82)');
  hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hl;
  ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fill();

  ctx.restore();
}

// ===== DRAW HEARTS =====
function drawHearts(){
  for(let i=0;i<MAX_MISS;i++){
    const alive=i<(MAX_MISS-missCount);
    const hx=18+i*28, hy=H-22, s=10;
    ctx.save(); ctx.globalAlpha=alive?1:0.2;
    ctx.fillStyle=alive?'#ff4466':'#666';
    ctx.beginPath();
    ctx.moveTo(hx,hy+s*0.25);
    ctx.bezierCurveTo(hx,hy-s*0.3,hx-s,hy-s*0.3,hx-s,hy+s*0.1);
    ctx.bezierCurveTo(hx-s,hy+s*0.6,hx,hy+s,hx,hy+s);
    ctx.bezierCurveTo(hx,hy+s,hx+s,hy+s*0.6,hx+s,hy+s*0.1);
    ctx.bezierCurveTo(hx+s,hy-s*0.3,hx,hy-s*0.3,hx,hy+s*0.25);
    ctx.fill(); ctx.restore();
  }
}

// ===== KICK =====
function tryKick(tapX, tapY){
  if(state!=='playing') return;
  const dx=tapX-ball.x, dy=tapY-ball.y;
  const dist=Math.sqrt(dx*dx+dy*dy);

  // ボールに当たっていなければ無視（何も起きない）
  if(dist>HIT_R) return;

  // タッチ位置→ボール中心への方向ベクトルで蹴り出し
  let vx, vy;
  if(dist<3){
    vx=0; vy=-15;
  } else {
    const nx=-dx/dist, ny=-dy/dist;
    const spd=14;
    vx = nx*spd*0.35 + (W/2-ball.x)*0.04;
    vy = Math.min(-8, ny*spd); // 必ず上方向
  }

  ball.vx = vx + (Math.random()-.5)*0.5;
  ball.vy = vy;
  ball.spin = (Math.random()-.5)*0.1;

  count++; combo++;
  if(count>best) best=count;
  hud();
  playKick();
  burst(ball.x, ball.y,
    combo%10===0?'#ffdd00':combo%5===0?'#44ff88':'#ff8800');

  if(combo>=20){ starBurst(ball.x,ball.y); showPopup(`🔥 ${combo}回！神業！`,'#ffdd00'); playComboSound(3); }
  else if(combo>=10){ starBurst(ball.x,ball.y); showPopup(`⚡ ${combo}回！スゴい！`,'#ffee44'); playComboSound(2); }
  else if(combo>=5){ showPopup(`✨ ${combo}回！いいね！`,'#44ff88'); playComboSound(1); }
  else if(combo===3){ showPopup('👍 3連続！','#fff'); playComboSound(0); }
  else {
    const msgs=['ナイス！','グッド！','ドンピシャ！','いいね！'];
    showPopup(msgs[Math.floor(Math.random()*msgs.length)],'#ffffff');
  }
}

// ===== MAIN LOOP =====
function loop(){
  requestAnimationFrame(loop);
  drawBg();
  ctx.clearRect(0,0,W,H);

  if(state==='playing'){
    ball.vy+=GRAVITY;
    ball.x +=ball.vx;
    ball.y +=ball.vy;
    ball.rot+=ball.spin;

    // 壁バウンド
    if(ball.x<BALL_R){ ball.x=BALL_R; ball.vx*=-0.5; }
    if(ball.x>W-BALL_R){ ball.x=W-BALL_R; ball.vx*=-0.5; }

    // 地面ミス
    if(ball.y>=GROUND_Y-BALL_R){
      ball.y=GROUND_Y-BALL_R;
      if(Math.abs(ball.vy)>2){
        missCount++; combo=0;
        playMiss();
        burst(ball.x,GROUND_Y,'#ff4444',14);
        showPopup('落とした…','#ff4444');
        hud();
        if(missCount>=MAX_MISS){
          state='gameover';
          setTimeout(()=>showOverlay('⚽ おわり！',count,'もう一度！'),700);
          return;
        }
      }
      ball.vy*=-0.3; ball.vx*=0.7;
    }

    if(popupTimer>0){ popupTimer--; if(popupTimer===0) document.getElementById('popup').style.opacity='0'; }
  }

  // パーティクル
  particles=particles.filter(pt=>{
    pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.15; pt.life-=pt.dec;
    if(pt.life<=0) return false;
    ctx.globalAlpha=pt.life;
    ctx.fillStyle=pt.col;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r*pt.life,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    return true;
  });

  drawBall();
  drawHearts();
}

// ===== INPUT =====
function getPos(e){
  const rect=cvs.getBoundingClientRect();
  const scaleX=W/rect.width, scaleY=H/rect.height;
  if(e.touches){
    return { x:(e.touches[0].clientX-rect.left)*scaleX,
             y:(e.touches[0].clientY-rect.top)*scaleY };
  }
  return { x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY };
}

cvs.addEventListener('mousedown', e=>{ const p=getPos(e); tryKick(p.x,p.y); });
cvs.addEventListener('touchstart', e=>{ e.preventDefault(); const p=getPos(e); tryKick(p.x,p.y); },{ passive:false });

// ===== START =====
drawBg();
loop();
</script>
</body>
</html>
