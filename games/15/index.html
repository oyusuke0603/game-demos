<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>縄跳びゲーム</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Zen Maru Gothic',sans-serif;background:linear-gradient(180deg,#87CEEB 60%,#5DBB63 60%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;user-select:none;}
.cloud{position:fixed;background:white;border-radius:50px;opacity:0.8;animation:drift linear infinite;}
.cloud::before,.cloud::after{content:'';position:absolute;background:white;border-radius:50%;}
.c1{width:110px;height:34px;top:10%;left:-120px;animation-duration:20s;}
.c1::before{width:54px;height:48px;top:-21px;left:14px;}
.c1::after{width:40px;height:40px;top:-17px;left:49px;}
.c2{width:78px;height:26px;top:23%;left:-88px;animation-duration:28s;animation-delay:-11s;}
.c2::before{width:38px;height:36px;top:-17px;left:11px;}
.c2::after{width:30px;height:30px;top:-13px;left:36px;}
@keyframes drift{from{transform:translateX(0);}to{transform:translateX(calc(100vw + 200px));}}
.sun{position:fixed;top:22px;right:42px;width:62px;height:62px;background:radial-gradient(circle,#FFE566,#FFD700);border-radius:50%;box-shadow:0 0 36px #FFD70088;}
#board{background:rgba(255,255,255,0.93);border-radius:16px;padding:10px 26px;display:flex;gap:34px;box-shadow:0 4px 16px rgba(0,0,0,0.14),0 0 0 3px white;}
.si{text-align:center;}
.sl{font-size:10px;color:#888;font-weight:700;letter-spacing:1px;}
.sv{font-size:29px;font-weight:900;color:#2d2d2d;line-height:1.1;}
#sv-score{color:#FF4444;}
#combo-msg{min-height:20px;font-size:14px;font-weight:700;color:#FF9500;text-shadow:0 1px 3px rgba(0,0,0,0.18);}
#timing-wrap{width:340px;display:flex;flex-direction:column;align-items:center;gap:4px;}
#timing-label{font-size:11px;color:white;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,0.4);}
#timing-outer{width:100%;height:15px;background:rgba(255,255,255,0.3);border-radius:8px;box-shadow:inset 0 2px 4px rgba(0,0,0,0.18),0 0 0 2px white;overflow:hidden;}
#timing-inner{height:100%;width:0%;border-radius:8px;transition:width .04s linear;}
#gc{border-radius:20px;box-shadow:0 8px 34px rgba(0,0,0,0.22),0 0 0 4px white;display:block;cursor:pointer;touch-action:none;}
#lv-badge{position:absolute;top:10px;right:10px;background:rgba(255,255,255,0.9);border-radius:10px;padding:3px 10px;font-size:11px;font-weight:700;color:#333;box-shadow:0 2px 6px rgba(0,0,0,0.14);}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,0.55);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;backdrop-filter:blur(4px);transition:opacity .3s;}
#overlay.hide{opacity:0;pointer-events:none;}
#ov-title{font-size:32px;font-weight:900;color:white;text-shadow:0 2px 10px rgba(0,0,0,0.5);}
#ov-score{font-size:17px;color:#FFD700;font-weight:700;min-height:26px;}
#ov-msg{font-size:13px;color:rgba(255,255,255,0.85);text-align:center;line-height:1.8;}
#jump-btn{width:128px;height:128px;border-radius:50%;border:none;background:radial-gradient(circle at 38% 32%,#FF8888,#FF2222);color:white;font-family:inherit;font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 7px 0 #AA0000,0 10px 26px rgba(255,30,30,0.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;touch-action:manipulation;}
#jump-btn:active{transform:translateY(6px);box-shadow:0 1px 0 #AA0000;}
#jump-btn .bi{font-size:29px;}
#jump-btn .bh{font-size:9px;opacity:0.85;}
#start-btn{padding:12px 42px;border-radius:50px;border:none;background:linear-gradient(135deg,#5DBB63,#3d8c42);color:white;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 5px 0 #2a6b2e,0 8px 18px rgba(93,187,99,0.4);letter-spacing:1px;}
#start-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #2a6b2e;}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:99;transition:opacity .12s;}
</style>
</head>
<body>
<div class="sun"></div>
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div id="flash"></div>

<div id="board">
  <div class="si"><div class="sl">スコア</div><div class="sv" id="sv-score">0</div></div>
  <div class="si"><div class="sl">連続</div><div class="sv" id="sv-combo">0</div></div>
  <div class="si"><div class="sl">ベスト</div><div class="sv" id="sv-best">0</div></div>
</div>
<div id="combo-msg"></div>
<div id="timing-wrap" style="display:none;">
  <div id="timing-label">🎵 タイミングバー（緑でジャンプ！）</div>
  <div id="timing-outer"><div id="timing-inner"></div></div>
</div>
<div style="position:relative;">
  <canvas id="gc" width="520" height="300"></canvas>
  <div id="lv-badge">Lv.1</div>
  <div id="overlay">
    <div id="ov-title">&#x1FA83; 縄跳びゲーム</div>
    <div id="ov-score"></div>
    <div id="ov-msg">縄が下に来たタイミングでジャンプ！<br>スペースキー / ↑キー / ボタン / 画面タップ</div>
  </div>
</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
  <button id="jump-btn" style="display:none;">
    <span class="bi">&#x1F998;</span>
    <span>ジャンプ</span>
    <span class="bh">SPACE / ↑</span>
  </button>
  <button id="start-btn">&#x25B6; スタート</button>
</div>

<script>
// ========== Audio ==========
var actx=null;
function getActx(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}
function snd(type){
  try{
    var c=getActx(),t=c.currentTime;
    if(type==='jump'){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(580,t+0.13);g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.start(t);o.stop(t+0.22);}
    else if(type==='land'){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='triangle';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(60,t+0.13);g.gain.setValueAtTime(0.32,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.16);o.start(t);o.stop(t+0.18);}
    else if(type==='miss'){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sawtooth';o.frequency.setValueAtTime(280,t);o.frequency.exponentialRampToValueAtTime(70,t+0.45);g.gain.setValueAtTime(0.28,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.5);o.start(t);o.stop(t+0.52);}
    else if(type==='combo'){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(440,t);o.frequency.setValueAtTime(660,t+0.09);g.gain.setValueAtTime(0.22,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.22);o.start(t);o.stop(t+0.24);}
    else if(type==='perfect'){var notes=[523,659,784,1047];for(var i=0;i<notes.length;i++){(function(f,s){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(0.2,s);g.gain.exponentialRampToValueAtTime(0.001,s+0.24);o.start(s);o.stop(s+0.26);})(notes[i],t+i*0.1);}}
    else if(type==='swing'){var n=Math.floor(c.sampleRate*0.07),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*0.11;var s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=buf;f.type='bandpass';f.frequency.value=700;s.connect(f);f.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0.18,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.09);s.start(t);s.stop(t+0.1);}
    else if(type==='start'){var notes=[261,329,392,523];for(var i=0;i<notes.length;i++){(function(f,s){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(0.17,s);g.gain.exponentialRampToValueAtTime(0.001,s+0.19);o.start(s);o.stop(s+0.21);})(notes[i],t+i*0.12);}}
    else if(type==='cd'){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(800,t);g.gain.setValueAtTime(0.17,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);o.start(t);o.stop(t+0.17);}
  }catch(e){}
}

// ========== Canvas ==========
var canvas=document.getElementById('gc');
var ctx=canvas.getContext('2d');
var W=canvas.width,H=canvas.height;
var GROUND_Y=H-72;

// ========== Game State ==========
var gstate='idle';
var score=0,combo=0,level=1;
var best=parseInt(localStorage.getItem('nb_best')||'0');
var ropeAngle=0,ropeSpeed=2.8;
var frameN=0,lastJumpF=-999;
var cdVal=3,cdTimer=0;
var particles=[],floats=[];

var P={x:W/2,y:GROUND_Y,vy:0,onGround:true};
var JUMP_POWER=-13;
var GRAVITY=0.75;
var PR=20;

// ジャンプ入力キュー
var jumpQueued=false;

// ========== Input ==========
document.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'){
    e.preventDefault();
    if(gstate==='playing'){
      jumpQueued=true;
    }else if(gstate==='idle'||gstate==='over'){
      startGame();
    }
  }
});

document.getElementById('jump-btn').addEventListener('pointerdown',function(e){
  e.preventDefault();
  if(gstate==='playing') jumpQueued=true;
});

document.getElementById('start-btn').addEventListener('click',function(){startGame();});

canvas.addEventListener('pointerdown',function(e){
  e.preventDefault();
  if(gstate==='playing') jumpQueued=true;
  else if(gstate==='idle'||gstate==='over') startGame();
});

// ========== Game Control ==========
function startGame(){
  getActx();
  score=0;combo=0;level=1;
  ropeAngle=0;ropeSpeed=2.8;
  frameN=0;lastJumpF=-999;
  cdVal=3;cdTimer=0;
  P.x=W/2;P.y=GROUND_Y;P.vy=0;P.onGround=true;
  jumpQueued=false;
  particles=[];floats=[];
  gstate='countdown';
  snd('cd');
  document.getElementById('overlay').classList.add('hide');
  document.getElementById('start-btn').style.display='none';
  document.getElementById('jump-btn').style.display='flex';
  document.getElementById('combo-msg').textContent='';
  document.getElementById('timing-wrap').style.display='flex';
  updateUI();
}

function doGameOver(){
  gstate='over';
  snd('miss');
  doFlash('miss');
  spawnP(P.x,P.y,'#FF6B6B',20);
  if(score>best){best=score;localStorage.setItem('nb_best',best);}
  setTimeout(function(){
    document.getElementById('ov-title').textContent='\uD83D\uDCA6 ゲームオーバー';
    document.getElementById('ov-score').textContent='スコア: '+score+'　ベスト: '+best;
    document.getElementById('ov-msg').textContent=(score>=best?'🏆 新記録！':'もう一回！')+'\nコンボ: '+combo;
    document.getElementById('overlay').classList.remove('hide');
    document.getElementById('start-btn').textContent='🔄 もう一度';
    document.getElementById('start-btn').style.display='';
    document.getElementById('jump-btn').style.display='none';
    document.getElementById('timing-wrap').style.display='none';
    updateUI();
  },700);
}

function updateUI(){
  document.getElementById('sv-score').textContent=score;
  document.getElementById('sv-combo').textContent=combo;
  document.getElementById('sv-best').textContent=best;
  document.getElementById('lv-badge').textContent='Lv.'+level;
}

function updateTimingBar(){
  var a=ropeAngle%360;
  var good=Math.max(0,1-Math.abs((a-180)/80));
  document.getElementById('timing-inner').style.width=(good*100)+'%';
  document.getElementById('timing-inner').style.background=
    good>0.65?'linear-gradient(90deg,#4CAF50,#8BC34A)':
    good>0.3 ?'linear-gradient(90deg,#FFC107,#FF9800)':
               'linear-gradient(90deg,#FF5722,#f44336)';
}

function doFlash(type){
  var el=document.getElementById('flash');
  el.style.background=type==='miss'?'rgba(255,0,0,0.24)':'rgba(255,240,0,0.28)';
  el.style.opacity='1';
  setTimeout(function(){el.style.opacity='0';},150);
}

// ========== Particles ==========
function spawnP(x,y,col,n){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,sp=2+Math.random()*5;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,r:3+Math.random()*5,col:col,life:40+Math.random()*20,max:60});
  }
}
function spawnF(x,y,txt,col,sz){floats.push({x:x,y:y,txt:txt,col:col,sz:sz,life:50});}

// ========== Draw ==========
function drawBg(){
  var sg=ctx.createLinearGradient(0,0,0,H*0.65);
  sg.addColorStop(0,'#6BBFE8');sg.addColorStop(1,'#B8E4FF');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H*0.65);
  var gg=ctx.createLinearGradient(0,H*0.65,0,H);
  gg.addColorStop(0,'#6DC86E');gg.addColorStop(1,'#3d8c42');
  ctx.fillStyle=gg;ctx.fillRect(0,H*0.65,W,H*0.35);
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,H*0.65);ctx.lineTo(W,H*0.65);ctx.stroke();
}

function drawPlayer(){
  var px=P.x,py=P.y,r=PR;
  var air=py<GROUND_Y-2;
  // 影
  var ss=air?Math.max(0.3,1-(GROUND_Y-py)/100):1;
  ctx.save();ctx.translate(px,GROUND_Y+5);ctx.scale(ss,0.22*ss);
  ctx.beginPath();ctx.arc(0,0,r+7,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.16)';ctx.fill();ctx.restore();
  ctx.save();ctx.translate(px,py);
  // 脚
  var la=air?0:Math.sin(frameN*0.14)*7;
  ctx.fillStyle='#3355BB';
  ctx.beginPath();ctx.roundRect(-9,r-3,7,air?16:12+Math.abs(la),3);ctx.fill();
  ctx.beginPath();ctx.roundRect(2,r-3,7,air?20:12-Math.abs(la)+2,3);ctx.fill();
  ctx.fillStyle='#1a2f88';
  ctx.beginPath();ctx.roundRect(-12,r+(air?11:8+Math.abs(la)),13,7,3);ctx.fill();
  ctx.beginPath();ctx.roundRect(1,r+(air?15:8-Math.abs(la)+2),13,7,3);ctx.fill();
  // 胴体
  ctx.fillStyle='#FF6B6B';
  ctx.beginPath();ctx.roundRect(-r+3,-r+5,(r-3)*2,r*1.55,9);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.26)';
  ctx.beginPath();ctx.roundRect(-r+7,-r+9,(r-7)*2,5,2);ctx.fill();
  // 腕
  var aa=air?-35:Math.sin(frameN*0.11)*18;
  for(var si=-1;si<=1;si+=2){
    ctx.save();ctx.translate(si*(r-3),-r+9);ctx.rotate((aa*si+si*15)*Math.PI/180);
    ctx.fillStyle='#FF6B6B';ctx.beginPath();ctx.roundRect(-4,0,9,17,4);ctx.fill();ctx.restore();
  }
  // 頭
  ctx.beginPath();ctx.arc(0,-r,r-1,0,Math.PI*2);
  ctx.fillStyle='#FFDAB9';ctx.fill();
  ctx.strokeStyle='#E8C4A0';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#5C3A1E';
  ctx.beginPath();ctx.arc(0,-r-1,r-3,Math.PI*1.1,Math.PI*1.9);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-r*2+3,r-4,7,0,0,Math.PI*2);ctx.fill();
  // 目・口
  ctx.fillStyle='#333';
  if(air){
    ctx.beginPath();ctx.arc(-6,-r-2,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(6,-r-2,2.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=1.8;
    ctx.beginPath();ctx.arc(0,-r+2,6,0.1,Math.PI-0.1);ctx.stroke();
  }else{
    ctx.beginPath();ctx.ellipse(-6,-r-2,2,2.5,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(6,-r-2,2,2.5,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=1.8;
    ctx.beginPath();ctx.arc(0,-r+3,5,0.2,Math.PI-0.2);ctx.stroke();
  }
  ctx.restore();
}

function drawRope(){
  var a=ropeAngle%360;
  var rad=(a-90)*Math.PI/180;
  var rl=88,rpx=P.x,rpy=GROUND_Y-8;
  var x1=rpx+Math.cos(rad)*rl,y1=rpy+Math.sin(rad)*rl;
  var x2=rpx+Math.cos(rad+Math.PI)*rl,y2=rpy+Math.sin(rad+Math.PI)*rl;
  var isBot=(a>150&&a<210),isTop=(a>330||a<30);
  if(isBot){ctx.save();ctx.shadowColor='rgba(255,80,0,0.7)';ctx.shadowBlur=13;}
  ctx.beginPath();ctx.moveTo(x1,y1);
  ctx.quadraticCurveTo(rpx,rpy+Math.sin(rad)*rl*0.33,x2,y2);
  ctx.strokeStyle=isBot?'#FF4400':isTop?'#44BB00':'#8B4513';
  ctx.lineWidth=isBot?5:4;ctx.lineCap='round';ctx.stroke();
  if(isBot)ctx.restore();
  var pts=[{x:x1,y:y1},{x:x2,y:y2}];
  for(var i=0;i<pts.length;i++){
    var pt=pts[i];
    var g2=ctx.createRadialGradient(pt.x-2,pt.y-2,1,pt.x,pt.y,8);
    g2.addColorStop(0,'#FFAA44');g2.addColorStop(1,'#CC5500');
    ctx.beginPath();ctx.arc(pt.x,pt.y,8,0,Math.PI*2);
    ctx.fillStyle=g2;ctx.fill();
    ctx.strokeStyle='#883300';ctx.lineWidth=1.5;ctx.stroke();
  }
}

function drawParticles(){
  particles=particles.filter(function(p){return p.life>0;});
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.save();ctx.globalAlpha=p.life/p.max;
    ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.life--;
  }
  floats=floats.filter(function(f){return f.life>0;});
  for(var i=0;i<floats.length;i++){
    var f=floats[i];
    ctx.save();ctx.globalAlpha=Math.min(1,f.life/18);
    ctx.font='bold '+f.sz+'px Zen Maru Gothic,sans-serif';
    ctx.textAlign='center';ctx.strokeStyle='white';ctx.lineWidth=3;
    ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);
    ctx.restore();f.y-=1.8;f.life--;
  }
}

function drawHUD(){
  var a=ropeAngle%360;
  if(a>145&&a<215){
    ctx.save();ctx.globalAlpha=0.45+Math.sin(frameN*0.35)*0.28;
    ctx.font='bold 13px Zen Maru Gothic,sans-serif';
    ctx.fillStyle='#FF3300';ctx.textAlign='center';
    ctx.fillText('▼ ジャンプ！',P.x,GROUND_Y+30);ctx.restore();
  }
}

function drawCountdown(){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.44)';ctx.fillRect(0,0,W,H);
  ctx.font='bold 86px Zen Maru Gothic,sans-serif';
  ctx.textAlign='center';ctx.fillStyle='#FFD700';
  ctx.shadowColor='#FF9500';ctx.shadowBlur=16;
  ctx.fillText(cdVal>0?String(cdVal):'GO!!',W/2,H/2+30);
  ctx.restore();
}

// ========== Main Loop ==========
function loop(){
  ctx.clearRect(0,0,W,H);
  drawBg();

  if(gstate==='countdown'){
    cdTimer++;
    if(cdTimer%60===0){
      cdVal--;
      if(cdVal>0)snd('cd');
      if(cdVal===0)setTimeout(function(){gstate='playing';snd('start');},550);
    }
    drawPlayer();drawParticles();drawCountdown();
  }
  else if(gstate==='playing'){
    frameN++;

    // 縄を回す
    var prevA=ropeAngle;
    ropeAngle=(ropeAngle+ropeSpeed)%360;
    if((prevA<90&&ropeAngle>=90)||(prevA<270&&ropeAngle>=270))snd('swing');

    // 物理演算
    if(!P.onGround){
      P.vy+=GRAVITY;
      P.y+=P.vy;
      if(P.y>=GROUND_Y){
        P.y=GROUND_Y;P.vy=0;P.onGround=true;
        snd('land');
        spawnP(P.x,GROUND_Y+7,'#5DBB63',5);
      }
    }

    // 縄の当たり判定
    var a=ropeAngle;
    if(a>152&&a<208&&P.onGround){
      doGameOver();
      requestAnimationFrame(loop);return;
    }

    // ジャンプ処理
    if(jumpQueued){
      jumpQueued=false;
      if(P.onGround&&frameN-lastJumpF>12){
        lastJumpF=frameN;
        P.vy=JUMP_POWER;
        P.onGround=false;
        snd('jump');
        var good=Math.max(0,1-Math.abs((a-180)/85));
        combo++;
        if(good>0.65){
          var pts=10+Math.floor(combo/5)*5;
          score+=pts;
          snd(combo%10===0?'perfect':'combo');
          spawnP(P.x,P.y-28,'#FFD700',16);
          spawnF(P.x,P.y-48,combo%10===0?'🌟 PERFECT!!':'✨ GREAT!','#FFD700',24);
          doFlash('good');
        }else{
          score+=10;
          if(combo%5===0)snd('combo');
          spawnP(P.x,P.y-18,'#87CEEB',7);
          if(combo>=5)spawnF(P.x,P.y-38,'x'+combo+'コンボ！','#FF9500',18);
        }
        var nl=Math.floor(score/60)+1;
        if(nl>level){
          level=nl;ropeSpeed=2.8+(level-1)*0.28;
          spawnF(P.x,P.y-65,'⬆ Lv.'+level+'!','#FF6B6B',20);
        }
        var cm=document.getElementById('combo-msg');
        if(combo>=20)cm.textContent='🔥 AMAZING!! x'+combo;
        else if(combo>=10)cm.textContent='⚡ SUPER!! x'+combo;
        else if(combo>=5)cm.textContent='✨ NICE!! x'+combo;
        else if(combo>=3)cm.textContent='👍 GOOD! x'+combo;
        else cm.textContent='';
        updateUI();
      }
    }

    updateTimingBar();
    drawPlayer();drawRope();drawParticles();drawHUD();
  }
  else{
    drawPlayer();drawParticles();
  }
  requestAnimationFrame(loop);
}

// ========== Init ==========
document.getElementById('sv-best').textContent=best;
loop();
</script>
</body>
</html>
